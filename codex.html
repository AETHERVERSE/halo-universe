<script>

const SUPABASE_URL =
"https://mkdkfnejqnqoalzyeqaw.supabase.co";


const SUPABASE_KEY =
"sb_publishable_uScqa4BUx4rq0lEmkVO-8Q_QsiyetmY";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   CONSTANTS
========================= */

const DISCOVERY_POINTS = 5;

const TOTAL_DISCOVERIES = 21;


/* =========================
   CREATE DISCOVERY BUTTON
========================= */

function addDiscoveryButton(
    element
) {

    const actionKey =
        element.dataset.actionKey;


    if (!actionKey) {

        console.warn(
            "Missing action key:",
            element
        );

        return;

    }


    const button =
        document.createElement(
            "button"
        );

    button.className =
        "discovery-button";

    button.dataset.actionKey =
        actionKey;

    button.textContent =
        "✦ DISCOVER — +5 STAR POINTS";


    const message =
        document.createElement(
            "div"
        );

    message.className =
        "discovery-message";


    element.appendChild(button);

    element.appendChild(message);


    button.addEventListener(
        "click",
        async function() {

            if (
                button.disabled
            ) {

                return;

            }


            button.disabled =
                true;

            button.textContent =
                "DISCOVERING...";

            message.textContent =
                "";


            const {
                data: {
                    user
                },
                error:
                    userError
            } =
            await supabaseClient
                .auth
                .getUser();


            if (
                userError ||
                !user
            ) {

                button.disabled =
                    false;

                button.textContent =
                    "✦ DISCOVER — +5 STAR POINTS";

                message.textContent =
                    "Please log in first.";

                return;

            }


            /*
               UNIVERSAL CODEX DISCOVERY

               The backend determines:
               - which member owns the entry
               - which reaction they send
               - whether points are awarded
               - whether the discovery already exists
            */

            const {
                data,
                error
            } =
            await supabaseClient
                .rpc(
                    "discover_codex_entry",
                    {
                        p_codex_key:
                            actionKey
                    }
                );


            if (error) {

                console.error(
                    "CODEX DISCOVERY ERROR:",
                    error
                );

                button.disabled =
                    false;

                button.textContent =
                    "✦ DISCOVER — +5 STAR POINTS";

                message.textContent =
                    "Could not record discovery.";

                return;

            }


            /*
               Non-null result means this
               was a genuine new discovery.
            */

            if (data !== null) {

                button.textContent =
                    "✓ DISCOVERED • +5 STAR POINTS";

                button.classList.add(
                    "discovered"
                );

                message.textContent =
                    "Your discovery has been recorded. ✦";

            }

            else {

                button.textContent =
                    "✓ ALREADY DISCOVERED";

                button.classList.add(
                    "discovered"
                );

                message.textContent =
                    "This memory is already part of your journey.";

            }

        }
    );

}


/* =========================
   SETUP ALL DISCOVERIES
========================= */

function setupDiscoveries() {

    const entries =
        document.querySelectorAll(
            "[data-action-key]"
        );


    entries.forEach(
        entry => {

            addDiscoveryButton(
                entry
            );

        }
    );


    console.log(
        "CODEX ENTRIES:",
        entries.length
    );

}


/* =========================
   LOAD DISCOVERED ENTRIES
========================= */

async function loadDiscovered() {

    const {
        data: {
            user
        },
        error:
            userError
    } =
    await supabaseClient
        .auth
        .getUser();


    if (
        userError ||
        !user
    ) {

        return;

    }


    /*
       Load the new Codex discovery table.
    */

    const {
        data:
            codexData,
        error:
            codexError
    } =
    await supabaseClient
        .from(
            "halo_codex_discoveries"
        )
        .select(
            "codex_key"
        )
        .eq(
            "user_id",
            user.id
        );


    if (codexError) {

        console.error(
            "CODEX DISCOVERY LOAD ERROR:",
            codexError
        );

        return;

    }


    /*
       Load legacy point events too.

       This ensures discoveries made before
       the new universal system remain locked.
    */

    const {
        data:
            legacyData,
        error:
            legacyError
    } =
    await supabaseClient
        .from(
            "halo_point_events"
        )
        .select(
            "action_key"
        )
        .eq(
            "user_id",
            user.id
        );


    if (legacyError) {

        console.error(
            "LEGACY DISCOVERY LOAD ERROR:",
            legacyError
        );

    }


    /*
       Combine both discovery systems.
    */

    const discovered =
        new Set();


    (codexData || [])
        .forEach(
            entry => {

                if (
                    entry.codex_key
                ) {

                    discovered.add(
                        entry.codex_key
                    );

                }

            }
        );


    (legacyData || [])
        .forEach(
            event => {

                if (
                    event.action_key
                ) {

                    discovered.add(
                        event.action_key
                    );

                }

            }
        );


    /*
       Lock discovered Codex entries.
    */

    document
        .querySelectorAll(
            ".discovery-button"
        )
        .forEach(
            button => {

                const key =
                    button.dataset
                        .actionKey;


                if (
                    discovered.has(key)
                ) {

                    button.textContent =
                        "✓ ALREADY DISCOVERED";

                    button.classList.add(
                        "discovered"
                    );

                    button.disabled =
                        true;

                }

            }
        );


    console.log(
        "CODEX DISCOVERED:",
        discovered.size,
        "/",
        TOTAL_DISCOVERIES
    );

}


/* =========================
   INITIALIZE
========================= */

async function initCodex() {

    setupDiscoveries();

    await loadDiscovered();

}


initCodex();

</script>
