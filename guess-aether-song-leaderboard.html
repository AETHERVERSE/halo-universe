<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Guess the AETHER Song Leaderboard | AETHERVERSE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#eeeaff;font-family:Georgia,serif;background:radial-gradient(circle at top,#29234f 0%,#12102c 45%,#0b0920 100%)}
.container{max-width:820px;margin:auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:30px}
.logo{letter-spacing:6px;font-size:.75rem;color:#aaa0e6;margin-bottom:18px}
nav{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
nav a,.back{color:#ddd7ff;text-decoration:none;border:1px solid #39345e;border-radius:25px;padding:8px 16px;font-size:.78rem}
.hero{text-align:center;margin:30px 0}
.symbol{font-size:3rem}
h1{font-size:2rem;letter-spacing:4px;margin:10px 0}
.subtitle{color:#aaa0e6;line-height:1.7}
.card{background:linear-gradient(145deg,rgba(48,42,92,.95),rgba(20,18,49,.98));border:1px solid #514879;border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.tabs{display:flex;justify-content:center;gap:10px;margin-bottom:22px}
.tab{border:1px solid #514879;background:#211d43;color:#aaa0e6;border-radius:22px;padding:9px 20px;cursor:pointer;font-family:Georgia,serif}
.tab.active{background:#5d508e;color:white;border-color:#9c8fe0}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 8px;text-align:left;border-bottom:1px solid #302b50}
th{color:#77739e;font-size:.7rem;letter-spacing:2px}
td{font-size:.88rem}
.rank{text-align:center;width:60px;color:#cdb9ff}
.score{text-align:right;color:#eeeaff;font-weight:bold}
.you{background:rgba(93,80,142,.22)}
.empty{text-align:center;color:#77739e;padding:30px}
.me{text-align:center;margin-top:20px;color:#aaa0e6;font-size:.8rem}
.actions{text-align:center;margin-top:25px}
.action{display:inline-block;text-decoration:none;color:#ddd7ff;border:1px solid #8f84c9;border-radius:25px;padding:10px 18px;font-size:.78rem;letter-spacing:1px}
footer{text-align:center;margin-top:40px;color:#77739e;font-size:.65rem;letter-spacing:2px;line-height:2}
@media(max-width:600px){h1{font-size:1.55rem}.card{padding:16px}th,td{padding:11px 5px;font-size:.78rem}}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">AETHERVERSE</div>
<nav>
<a href="halo-home.html">MY HALO</a>
<a href="aether-arcade.html">AETHER ARCADE</a>
<a href="guess-the-aether-song.html">🎵 PLAY GAME</a>
</nav>
</header>

<section class="hero">
<div class="symbol">🏆</div>
<h1>GUESS THE AETHER SONG</h1>
<div class="subtitle">Who knows the BREAK THE BUBBLE sound best?</div>
</section>

<section class="card">
<div class="tabs">
<button class="tab active" id="allBtn">ALL TIME</button>
<button class="tab" id="todayBtn">TODAY</button>
</div>
<div id="tableWrap">LOADING…</div>
<div class="me" id="me"></div>
<div class="actions">
<a class="action" href="guess-the-aether-song.html">← BACK TO GAME</a>
</div>
</section>

<footer>ONE HALO · ONE SONG · EVERY DAY<br>AETHERVERSE · BREAK THE BUBBLE</footer>
</div>

<script>
const SUPABASE_URL="https://mkdkfnejqnqoalzyeqaw.supabase.co";
const SUPABASE_KEY="sb_publishable_uScqa4BUx4rq0lEmkVO-8Q_QsiyetmY";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const tableWrap=document.getElementById("tableWrap");
const me=document.getElementById("me");
let mode="all_time";

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

async function load(){
tableWrap.innerHTML="LOADING…";me.textContent="";
const {data,error}=await supabaseClient.rpc("get_guess_aether_song_leaderboard",{p_mode:mode});
if(error){tableWrap.innerHTML="<div class='empty'>LEADERBOARD COULD NOT BE LOADED.</div>";return}
const entries=data?.entries||[];
if(!entries.length){tableWrap.innerHTML="<div class='empty'>No scores yet. Be the first HALO to play! ✦</div>";return}
const my=data?.me;
const myScore=my?.score;
let rows="<table><thead><tr><th>#</th><th>HALO</th><th>SCORE</th></tr></thead><tbody>";
entries.slice(0,50).forEach((e,i)=>{
const isMe=myScore!==undefined && Number(e.score)===Number(myScore) && !rows.includes("data-me-used");
rows+=`<tr class="${isMe?"you":""}" ${isMe?"data-me-used":""}><td class="rank">${e.rank||i+1}</td><td>${esc(e.halo_id||"HALO")}</td><td class="score">${Number(e.score)||0}</td></tr>`;
});
rows+="</tbody></table>";
tableWrap.innerHTML=rows;
if(my)me.textContent=`YOUR BEST: ${my.score} POINTS · HINTS BONUS: ${my.best_combo||0}`;
}
function setMode(next){
mode=next;
document.getElementById("allBtn").classList.toggle("active",mode==="all_time");
document.getElementById("todayBtn").classList.toggle("active",mode==="today");
load();
}
document.getElementById("allBtn").onclick=()=>setMode("all_time");
document.getElementById("todayBtn").onclick=()=>setMode("today");
supabaseClient.auth.getSession().then(({data:{session}})=>{if(session)load();else tableWrap.innerHTML="<div class='empty'>PLEASE LOG IN THROUGH MY HALO.</div>"});
</script>
</body>
</html>
