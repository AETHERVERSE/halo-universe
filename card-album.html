<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AETHER — Card Album</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --bg: #070914;
    --bg-soft: #0d1120;
    --panel: #11162a;
    --panel-light: #171d35;
    --line: #2a3150;

    --text: #f5f7ff;
    --muted: #9da6c5;

    --accent: #b9a7ff;
    --accent-soft: rgba(185,167,255,0.12);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #191d40 0%,
            #0b0e1b 42%,
            #070914 75%
        );

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: inherit;
}

.page {
    width: min(1180px, 92%);
    margin: 0 auto;
}


/* =========================================================
   NAVIGATION
========================================================= */

.topbar {
    padding: 26px 0 18px;

    border-bottom:
        1px solid var(--line);
}

.nav {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
}

.nav a {
    color: var(--muted);

    font-size: 12px;
    letter-spacing: 0.1em;

    transition: 0.2s ease;
}

.nav a:hover {
    color: var(--text);
}

.nav .active {
    color: var(--text);
}


/* =========================================================
   HERO
========================================================= */

.hero {
    padding: 48px 0 30px;
}

.eyebrow {
    color: var(--accent);

    font-size: 12px;
    letter-spacing: 0.24em;
    font-weight: 700;
}

.hero h1 {
    margin: 10px 0 8px;

    font-size:
        clamp(38px, 7vw, 68px);

    letter-spacing: 0.04em;
    line-height: 1;
}

.hero p {
    max-width: 680px;

    margin: 0;

    color: var(--muted);

    line-height: 1.7;
    font-size: 15px;
}


/* =========================================================
   ERROR
========================================================= */

.error {
    display: none;

    margin-bottom: 20px;
    padding: 14px;

    border-radius: 12px;

    background: #351923;
    border: 1px solid #73384a;

    color: #ffdce4;

    font-size: 13px;
    line-height: 1.5;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-box {
    margin-bottom: 28px;
    padding: 20px;

    background:
        rgba(17,22,42,0.85);

    border:
        1px solid var(--line);

    border-radius: 18px;
}

.progress-top {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 20px;
}

.progress-title {
    font-size: 13px;
    letter-spacing: 0.12em;
}

.progress-count {
    color: var(--accent);

    font-size: 13px;
    font-weight: 700;
}

.progress-track {
    height: 8px;

    margin-top: 14px;

    background: #242a45;

    border-radius: 999px;

    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            #8c7cff,
            #d8d0ff
        );

    transition:
        width 0.4s ease;
}


/* =========================================================
   FILTER AREA
========================================================= */

.filter-section {
    margin-bottom: 24px;
}

.filter-heading {
    margin-bottom: 10px;

    color: var(--muted);

    font-size: 10px;
    letter-spacing: 0.16em;
}

.filters {
    display: flex;

    gap: 9px;

    overflow-x: auto;

    padding:
        2px 0 8px;

    scrollbar-width: thin;
}

.filter {
    flex:
        0 0 auto;

    padding:
        10px 15px;

    border:
        1px solid var(--line);

    border-radius:
        999px;

    background:
        var(--panel);

    color:
        var(--muted);

    cursor: pointer;

    font-size: 11px;
    letter-spacing: 0.08em;

    transition:
        0.2s ease;
}

.filter:hover {
    border-color:
        var(--accent);

    color:
        var(--text);
}

.filter.active {
    border-color:
        var(--accent);

    background:
        var(--accent-soft);

    color:
        var(--text);
}


/* =========================================================
   CARD GRID
========================================================= */

.card-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px, 1fr)
        );

    gap: 18px;

    padding-bottom: 70px;
}


/* =========================================================
   CARD
========================================================= */

.card {
    position: relative;

    min-height: 330px;

    padding: 14px;

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;

    background:
        linear-gradient(
            145deg,
            #171c34,
            #0c1020
        );

    border:
        1px solid var(--line);

    border-radius:
        18px;

    overflow:
        hidden;

    cursor:
        pointer;

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.card:hover {
    transform:
        translateY(-4px);

    border-color:
        #4a5279;

    box-shadow:
        0 14px 35px
        rgba(0,0,0,0.28);
}

.card.locked {
    opacity:
        0.62;
}


/* =========================================================
   CARD NUMBER
========================================================= */

.card-number {
    color:
        var(--muted);

    font-size:
        10px;

    letter-spacing:
        0.16em;
}


/* =========================================================
   CARD IMAGE
========================================================= */

.card-image {
    height:
        185px;

    margin-top:
        10px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        13px;

    background:
        radial-gradient(
            circle,
            #252b4b 0%,
            #111528 55%,
            #090c17 100%
        );

    color:
        #687293;

    font-size:
        11px;

    letter-spacing:
        0.14em;

    text-align:
        center;

    overflow:
        hidden;
}

.card-image img {
    width:
        100%;

    height:
        100%;

    object-fit:
        contain;

    display:
        block;
}


/* =========================================================
   LOCKED CARD
========================================================= */

.locked-image {
    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    width:
        100%;

    height:
        100%;

    color:
        #687293;

    gap:
        8px;
}

.lock-icon {
    font-size:
        28px;

    opacity:
        0.7;
}


/* =========================================================
   CARD INFO
========================================================= */

.card-info {
    padding-top:
        12px;
}

.card-name {
    font-size:
        15px;

    font-weight:
        700;

    line-height:
        1.3;
}

.card-title {
    margin-top:
        5px;

    color:
        var(--muted);

    font-size:
        11px;

    line-height:
        1.4;
}


/* =========================================================
   CARD BOTTOM
========================================================= */

.card-bottom {
    display:
        flex;

    align-items:
        flex-end;

    justify-content:
        space-between;

    gap:
        10px;

    margin-top:
        12px;
}

.rarity {
    display:
        inline-block;

    padding:
        5px 8px;

    border:
        1px solid var(--line);

    border-radius:
        999px;

    color:
        var(--accent);

    font-size:
        9px;

    letter-spacing:
        0.14em;
}

.card-status {
    color:
        var(--muted);

    font-size:
        9px;

    text-align:
        right;

    letter-spacing:
        0.08em;
}


/* =========================================================
   RARITY DISPLAY
========================================================= */

.rarity-common {
    color:
        #b8bfd8;
}

.rarity-rare {
    color:
        #9fc5ff;
}

.rarity-epic {
    color:
        #c6a7ff;
}

.rarity-legendary {
    color:
        #f1d58a;
}

.rarity-secret {
    color:
        #ff9fd3;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {
    grid-column:
        1 / -1;

    padding:
        55px 20px;

    text-align:
        center;

    border:
        1px dashed var(--line);

    border-radius:
        18px;

    color:
        var(--muted);

    line-height:
        1.7;
}


/* =========================================================
   CARD MODAL
========================================================= */

.card-modal {
    position:
        fixed;

    inset:
        0;

    z-index:
        1000;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(3,5,14,0.88);

    backdrop-filter:
        blur(10px);
}

.card-modal.open {
    display:
        flex;
}

.card-modal-content {
    position:
        relative;

    width:
        min(92vw, 520px);

    max-height:
        92vh;

    overflow-y:
        auto;

    padding:
        20px;

    background:
        linear-gradient(
            145deg,
            #171c34,
            #0c1020
        );

    border:
        1px solid #4a5279;

    border-radius:
        22px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.55);
}

.card-modal-close {
    position:
        absolute;

    top:
        12px;

    right:
        12px;

    z-index:
        2;

    width:
        36px;

    height:
        36px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border:
        1px solid var(--line);

    border-radius:
        50%;

    background:
        rgba(7,9,20,0.8);

    color:
        var(--text);

    cursor:
        pointer;

    font-size:
        18px;

    transition:
        0.2s ease;
}

.card-modal-close:hover {
    border-color:
        var(--accent);

    background:
        var(--accent-soft);
}

.card-modal-image {
    width:
        100%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        15px;

    overflow:
        hidden;

    background:
        radial-gradient(
            circle,
            #252b4b 0%,
            #111528 55%,
            #090c17 100%
        );
}

.card-modal-image img {
    display:
        block;

    width:
        100%;

    max-height:
        68vh;

    object-fit:
        contain;
}

.card-modal-info {
    padding:
        18px 4px 4px;
}

.card-modal-number {
    color:
        var(--muted);

    font-size:
        10px;

    letter-spacing:
        0.18em;
}

.card-modal-title {
    margin-top:
        8px;

    font-size:
        24px;

    font-weight:
        700;

    line-height:
        1.25;
}

.card-modal-description {
    margin-top:
        10px;

    color:
        var(--muted);

    font-size:
        13px;

    line-height:
        1.7;
}

.card-modal-rarity {
    display:
        inline-block;

    margin-top:
        14px;

    padding:
        6px 10px;

    border:
        1px solid var(--line);

    border-radius:
        999px;

    color:
        var(--accent);

    font-size:
        9px;

    letter-spacing:
        0.14em;
}

.card-modal-locked {
    padding:
        45px 20px;

    text-align:
        center;
}

.card-modal-locked-icon {
    font-size:
        42px;

    margin-bottom:
        15px;

    opacity:
        0.75;
}

.card-modal-locked-title {
    font-size:
        22px;

    font-weight:
        700;
}

.card-modal-locked-text {
    margin-top:
        10px;

    color:
        var(--muted);

    font-size:
        13px;

    line-height:
        1.7;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .topbar {
        padding-top:
            20px;
    }

    .nav {
        gap:
            12px;
    }

    .hero {
        padding-top:
            36px;
    }

    .hero h1 {
        font-size:
            42px;
    }

    .card-grid {
        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );

        gap:
            12px;
    }

    .card {
        min-height:
            285px;

        padding:
            11px;
    }

    .card-image {
        height:
            145px;
    }

    .card-name {
        font-size:
            13px;
    }

    .card-title {
        font-size:
            10px;
    }

    .progress-top {
        align-items:
            flex-start;

        flex-direction:
            column;

        gap:
            8px;
    }

    .card-modal {
        padding:
            12px;
    }

    .card-modal-content {
        width:
            100%;

        max-height:
            94vh;

        padding:
            14px;

        border-radius:
            18px;
    }

    .card-modal-image img {
        max-height:
            65vh;
    }

    .card-modal-title {
        font-size:
            20px;
    }

}

</style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://mkdkfnejqnqoalzyeqaw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_uScqa4BUx4rq0lEmkVO-8Q_QsiyetmY";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   STATE
========================================================= */

let cards = [];

let ownedCards =
    new Set();

let activeSet =
    "ALL";

let activeRarity =
    "ALL";

let currentSession =
    null;


/* =========================================================
   SETS
========================================================= */

const SETS = [

    {
        key: "ALL",
        label: "ALL"
    },

    {
        key: "THE_SEVEN",
        label: "THE SEVEN"
    },

    {
        key: "THE_GUARDIANS",
        label: "THE GUARDIANS"
    },

    {
        key: "THE_WORLDS",
        label: "THE WORLDS"
    },

    {
        key: "AETHER_BACKSTAGE",
        label: "AETHER BACKSTAGE"
    },

    {
        key: "AETHER_BONDS",
        label: "AETHER BONDS"
    },

    {
        key: "MEMORY_CARDS",
        label: "MEMORY CARDS"
    },

    {
        key: "SECRET_CARDS",
        label: "SECRET CARDS"
    }

];


/* =========================================================
   RARITIES
========================================================= */

const RARITIES = [

    {
        key: "ALL",
        label: "ALL"
    },

    {
        key: "COMMON",
        label: "COMMON"
    },

    {
        key: "RARE",
        label: "RARE"
    },

    {
        key: "EPIC",
        label: "EPIC"
    },

    {
        key: "LEGENDARY",
        label: "LEGENDARY"
    },

    {
        key: "SECRET",
        label: "SECRET"
    }

];


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    const element =
        document.getElementById(
            "error"
        );

    element.textContent =
        message;

    element.style.display =
        "block";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   RARITY CLASS
========================================================= */

function rarityClass(
    rarity
) {

    return String(
        rarity || ""
    )
        .toLowerCase()
        .replace(
            /[^a-z]/g,
            ""
        );

}


/* =========================================================
   SET FILTERS
========================================================= */

function renderSetFilters() {

    const container =
        document.getElementById(
            "set-filters"
        );


    if (!container) {

        return;

    }


    container.innerHTML =
        SETS.map(
            set => {

                const active =
                    set.key === activeSet
                        ? "active"
                        : "";


                return `

                    <button
                        type="button"
                        class="filter ${active}"
                        data-set="${escapeHtml(set.key)}"
                    >
                        ${escapeHtml(set.label)}
                    </button>

                `;

            }
        ).join("");


    container
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        activeSet =
                            button.dataset.set;

                        renderSetFilters();

                        renderCards();

                    }
                );

            }
        );

}


/* =========================================================
   RARITY FILTERS
========================================================= */

function renderRarityFilters() {

    const container =
        document.getElementById(
            "rarity-filters"
        );


    if (!container) {

        return;

    }


    container.innerHTML =
        RARITIES.map(
            rarity => {

                const active =
                    rarity.key === activeRarity
                        ? "active"
                        : "";


                return `

                    <button
                        type="button"
                        class="filter ${active}"
                        data-rarity="${escapeHtml(rarity.key)}"
                    >
                        ${escapeHtml(rarity.label)}
                    </button>

                `;

            }
        ).join("");


    container
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        activeRarity =
                            button.dataset.rarity;

                        renderRarityFilters();

                        renderCards();

                    }
                );

            }
        );

}


/* =========================================================
   LOAD CARDS
========================================================= */

async function loadCards() {

    const {
        data,
        error
    } = await db

        .from("aether_cards")

        .select(`
            id,
            card_number,
            card_key,
            set_key,
            title,
            description,
            rarity,
            image_url,
            content_data
        `)

        .eq(
            "is_active",
            true
        )

        .order(
            "card_number",
            {
                ascending: true
            }
        );


    if (error) {

        throw error;

    }


    cards =
        data || [];

}


/* =========================================================
   LOAD OWNERSHIP
========================================================= */

async function loadOwnership() {

    const {
        data,
        error
    } = await db

        .from("aether_card_ownership")

        .select(`
            card_id
        `)

        .eq(
            "user_id",
            currentSession.user.id
        );


    if (error) {

        throw error;

    }


    ownedCards.clear();


    (data || []).forEach(
        row => {

            if (
                row.card_id
            ) {

                ownedCards.add(
                    row.card_id
                );

            }

        }
    );

}


/* =========================================================
   CHECK CARD 022
========================================================= */

async function checkCard022() {

    const {
        data,
        error
    } = await db.rpc(
        "check_aether_card_022"
    );


    if (error) {

        console.error(
            "Card 022 unlock error:",
            error
        );

        return null;

    }


    console.log(
        "Card 022 unlock result:",
        data
    );


    return data;

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const total =
        cards.length;

    const owned =
        ownedCards.size;

    const percentage =
        total > 0
            ? (
                owned /
                total
            ) * 100
            : 0;


    document
        .getElementById(
            "progress-count"
        )
        .textContent =
            `${owned} / ${total} CARDS`;


    document
        .getElementById(
            "progress-fill"
        )
        .style.width =
            `${percentage}%`;

}


/* =========================================================
   CARD IMAGE
========================================================= */

function renderCardImage(
    card,
    owned
) {

    if (
        !owned
    ) {

        return `

            <div class="locked-image">

                <div class="lock-icon">
                    ✦
                </div>

                <div>
                    LOCKED
                </div>

            </div>

        `;

    }


    if (
        card.image_url
    ) {

        return `

            <img
                src="${escapeHtml(card.image_url)}"
                alt="${escapeHtml(card.title)}"
                loading="lazy"
            >

        `;

    }


    return `

        <div>
            CARD COLLECTED
        </div>

    `;

}


/* =========================================================
   FILTER CARDS
========================================================= */

function getVisibleCards() {

    return cards.filter(
        card => {

            const matchesSet =
                activeSet === "ALL" ||
                card.set_key === activeSet;


            const matchesRarity =
                activeRarity === "ALL" ||
                card.rarity === activeRarity;


            return (
                matchesSet &&
                matchesRarity
            );

        }
    );

}


/* =========================================================
   RENDER CARDS
========================================================= */

function renderCards() {

    const grid =
        document.getElementById(
            "card-grid"
        );


    if (!grid) {

        return;

    }


    const visibleCards =
        getVisibleCards();


    if (
        !visibleCards.length
    ) {

        grid.innerHTML = `

            <div class="empty">

                No cards match these filters yet.

            </div>

        `;

        return;

    }


    grid.innerHTML =
        visibleCards.map(
            card => {

                const owned =
                    ownedCards.has(
                        card.id
                    );


                const rarity =
                    rarityClass(
                        card.rarity
                    );


                const cardNumber =
                    String(
                        card.card_number
                    ).padStart(
                        3,
                        "0"
                    );


                return `

                    <article
                        class="card ${
                            owned
                                ? ""
                                : "locked"
                        }"
                        data-card-id="${escapeHtml(card.id)}"
                        tabindex="0"
                        role="button"
                        aria-label="${
                            owned
                                ? `Open Card ${cardNumber}`
                                : `Card ${cardNumber} is locked`
                        }"
                    >

                        <div>

                            <div
                                class="card-number"
                            >
                                CARD ${cardNumber}
                            </div>


                            <div
                                class="card-image"
                            >

                                ${renderCardImage(
                                    card,
                                    owned
                                )}

                            </div>


                            <div
                                class="card-info"
                            >

                                <div
                                    class="card-name"
                                >
                                    ${
                                        owned
                                            ? escapeHtml(
                                                card.title
                                            )
                                            : "AETHER CARD"
                                    }
                                </div>


                                <div
                                    class="card-title"
                                >
                                    ${
                                        owned
                                            ? escapeHtml(
                                                card.description ||
                                                card.title
                                            )
                                            : "Discover this card to reveal it."
                                    }
                                </div>

                            </div>

                        </div>


                        <div
                            class="card-bottom"
                        >

                            <span
                                class="rarity rarity-${rarity}"
                            >
                                ${escapeHtml(
                                    card.rarity
                                )}
                            </span>


                            <span
                                class="card-status"
                            >

                                ${
                                    owned
                                        ? "COLLECTED"
                                        : "NOT YET DISCOVERED"
                                }

                            </span>

                        </div>

                    </article>

                `;

            }
        ).join("");

}


/* =========================================================
   CARD MODAL
========================================================= */

const cardModal =
    document.getElementById(
        "card-modal"
    );

const cardModalBody =
    document.getElementById(
        "card-modal-body"
    );

const cardModalClose =
    document.getElementById(
        "card-modal-close"
    );


function openCardModal(card) {

    if (
        !cardModal ||
        !cardModalBody
    ) {

        return;

    }


    const owned =
        ownedCards.has(
            card.id
        );


    const cardNumber =
        String(
            card.card_number
        ).padStart(
            3,
            "0"
        );


    const rarity =
        rarityClass(
            card.rarity
        );


    if (
        owned
    ) {

        cardModalBody.innerHTML = `

            <div class="card-modal-image">

                ${
                    card.image_url

                        ? `

                            <img
                                src="${escapeHtml(card.image_url)}"
                                alt="${escapeHtml(card.title)}"
                            >

                        `

                        : `

                            <div
                                style="
                                    padding:60px 20px;
                                    color:#687293;
                                    text-align:center;
                                "
                            >
                                CARD COLLECTED
                            </div>

                        `
                }

            </div>


            <div class="card-modal-info">

                <div class="card-modal-number">
                    CARD ${cardNumber}
                </div>


                <div
                    class="card-modal-title"
                    id="card-modal-title"
                >
                    ${escapeHtml(
                        card.title
                    )}
                </div>


                <div class="card-modal-description">

                    ${escapeHtml(
                        card.description ||
                        "AETHER CARD"
                    )}

                </div>


                <div
                    class="card-modal-rarity rarity-${rarity}"
                >
                    ${escapeHtml(
                        card.rarity
                    )}
                </div>

            </div>

        `;

    }

    else {

        cardModalBody.innerHTML = `

            <div class="card-modal-locked">

                <div
                    class="card-modal-locked-icon"
                >
                    ✦
                </div>


                <div
                    class="card-modal-number"
                >
                    CARD ${cardNumber}
                </div>


                <div
                    class="card-modal-locked-title"
                    id="card-modal-title"
                >
                    AETHER CARD
                </div>


                <div
                    class="card-modal-locked-text"
                >
                    This card has not been discovered yet.
                    Keep exploring the AETHER universe
                    to reveal it.
                </div>

            </div>

        `;

    }


    cardModal.classList.add(
        "open"
    );

    cardModal.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.style.overflow =
        "hidden";

}


function closeCardModal() {

    if (
        !cardModal
    ) {

        return;

    }


    cardModal.classList.remove(
        "open"
    );

    cardModal.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.style.overflow =
        "";

}


/* =========================================================
   CARD CLICK EVENTS
========================================================= */

document
    .getElementById(
        "card-grid"
    )
    .addEventListener(
        "click",
        event => {

            const cardElement =
                event.target.closest(
                    ".card[data-card-id]"
                );


            if (
                !cardElement
            ) {

                return;

            }


            const card =
                cards.find(
                    item =>
                        item.id ===
                        cardElement.dataset.cardId
                );


            if (
                !card
            ) {

                return;

            }


            openCardModal(
                card
            );

        }
    );


document
    .getElementById(
        "card-grid"
    )
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key !== "Enter" &&
                event.key !== " "
            ) {

                return;

            }


            event.preventDefault();


            const cardElement =
                event.target.closest(
                    ".card[data-card-id]"
                );


            if (
                !cardElement
            ) {

                return;

            }


            const card =
                cards.find(
                    item =>
                        item.id ===
                        cardElement.dataset.cardId
                );


            if (
                !card
            ) {

                return;

            }


            openCardModal(
                card
            );

        }
    );


/* =========================================================
   MODAL CLOSE
========================================================= */

cardModalClose.addEventListener(
    "click",
    closeCardModal
);


cardModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            cardModal
        ) {

            closeCardModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeCardModal();

        }

    }
);


/* =========================================================
   LOGOUT
========================================================= */

document
    .getElementById(
        "logout"
    )
    .addEventListener(
        "click",
        async event => {

            event.preventDefault();


            try {

                await db
                    .auth
                    .signOut();

            }

            finally {

                window.location.href =
                    "halo.html";

            }

        }
    );


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
    (
        event,
        session
    ) => {

        if (
            event === "SIGNED_OUT"
        ) {

            window.location.href =
                "halo.html";

        }

    }
);


/* =========================================================
   INIT
========================================================= */

async function init() {

    /*
        Render the interface immediately.
        This keeps the filters visible even if
        Supabase data loading fails.
    */

    renderSetFilters();

    renderRarityFilters();

    renderCards();


    try {

        const {
            data,
            error
        } =
            await db
                .auth
                .getSession();


        if (
            error
        ) {

            throw error;

        }


        if (
            !data ||
            !data.session
        ) {

            window.location.href =
                "halo.html";

            return;

        }


        currentSession =
            data.session;


        /* -----------------------------------------
           LOAD CARD DATABASE
        ----------------------------------------- */

        await loadCards();


        /* -----------------------------------------
           CHECK CARD UNLOCKS
           
           For now this tests the first real
           acquisition trigger:
           BACKSTAGE_001 / Card 022
        ----------------------------------------- */

        await checkCard022();


        /* -----------------------------------------
           LOAD UPDATED OWNERSHIP
        ----------------------------------------- */

        await loadOwnership();


        updateProgress();

        renderCards();

    }

    catch (error) {

        console.error(
            "AETHER CARD ALBUM ERROR:",
            error
        );


        showError(
            "CARD ALBUM ERROR: " +
            (
                error?.message ||
                String(error)
            )
        );

    }

}


init();

</script>
