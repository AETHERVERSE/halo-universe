<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
MY COLLECTION | AETHERVERSE
</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            rgba(255,255,255,0.08),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #090b13 0%,
            #05060b 100%
        );

    color: #ffffff;
}


a {

    color: inherit;

    text-decoration: none;
}


.page {

    width: 100%;

    max-width: 1200px;

    margin: 0 auto;

    padding:
        28px 20px 60px;
}


/* ======================================================
   HEADER
====================================================== */

header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 50px;
}


.brand {

    font-size: 14px;

    letter-spacing: 4px;

    font-weight: 700;

    opacity: 0.8;
}


nav {

    display: flex;

    align-items: center;

    gap: 22px;

    flex-wrap: wrap;

    justify-content: flex-end;
}


nav a {

    font-size: 13px;

    letter-spacing: 1.5px;

    opacity: 0.65;

    transition:
        opacity 0.2s ease;
}


nav a:hover {

    opacity: 1;
}


/* ======================================================
   HERO
====================================================== */

.hero {

    text-align: center;

    margin-bottom: 42px;
}


.eyebrow {

    font-size: 11px;

    letter-spacing: 5px;

    text-transform: uppercase;

    opacity: 0.5;

    margin-bottom: 14px;
}


h1 {

    margin: 0;

    font-size:
        clamp(
            36px,
            8vw,
            70px
        );

    letter-spacing: 7px;

    font-weight: 300;
}


.hero p {

    max-width: 650px;

    margin:
        18px auto 0;

    line-height: 1.7;

    font-size: 15px;

    opacity: 0.65;
}


/* ======================================================
   COLLECTION COUNTER
====================================================== */

.collection-counter {

    text-align: center;

    margin:
        -15px 0 28px;

    font-size: 11px;

    letter-spacing: 2px;

    opacity: 0.45;
}


/* ======================================================
   FILTERS
====================================================== */

.filters {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-bottom: 25px;
}


.filter-button {

    border:
        1px solid
        rgba(255,255,255,0.16);

    background:
        rgba(255,255,255,0.035);

    color: #ffffff;

    padding:
        10px 16px;

    border-radius: 999px;

    font-size: 11px;

    letter-spacing: 1.5px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}


.filter-button:hover {

    background:
        rgba(255,255,255,0.08);

    border-color:
        rgba(255,255,255,0.3);

    transform:
        translateY(-1px);
}


.filter-button.active {

    background:
        rgba(255,255,255,0.14);

    border-color:
        rgba(255,255,255,0.4);
}


/* ======================================================
   STATUS
====================================================== */

.status {

    text-align: center;

    min-height: 24px;

    margin-bottom: 20px;

    font-size: 13px;

    opacity: 0.6;
}


.status.error {

    color: #ff8d8d;

    opacity: 1;
}


.status.success {

    color: #d9d0ff;

    opacity: 1;
}


/* ======================================================
   COLLECTION GRID
====================================================== */

.collection-grid {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0, 1fr)
        );

    gap: 20px;
}


.collection-card {

    position: relative;

    overflow: hidden;

    min-height: 240px;

    padding: 24px;

    border:
        1px solid
        rgba(255,255,255,0.1);

    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.07),
            rgba(255,255,255,0.025)
        );

    box-shadow:
        0 18px 50px
        rgba(0,0,0,0.22);
}


.collection-card::before {

    content: "";

    position: absolute;

    width: 160px;

    height: 160px;

    right: -70px;

    top: -70px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.04);

    pointer-events: none;
}


.card-category {

    display: inline-block;

    margin-bottom: 24px;

    font-size: 10px;

    letter-spacing: 2px;

    opacity: 0.5;
}


.collection-card h2 {

    position: relative;

    margin:
        0 0 12px;

    font-size: 22px;

    font-weight: 400;
}


.collection-card p {

    position: relative;

    margin: 0;

    line-height: 1.6;

    font-size: 14px;

    opacity: 0.62;
}


.card-meta {

    position: absolute;

    left: 24px;

    right: 24px;

    bottom: 22px;

    display: flex;

    justify-content: space-between;

    gap: 10px;

    font-size: 10px;

    letter-spacing: 1.3px;

    opacity: 0.4;
}


/* ======================================================
   EMPTY STATE
====================================================== */

.empty-state {

    text-align: center;

    padding:
        70px 20px;

    border:
        1px dashed
        rgba(255,255,255,0.12);

    border-radius: 20px;

    opacity: 0.7;
}


.empty-state h2 {

    margin:
        0 0 12px;

    font-weight: 400;

    letter-spacing: 2px;
}


.empty-state p {

    margin: 0;

    line-height: 1.7;

    font-size: 14px;

    opacity: 0.65;
}


/* ======================================================
   MOBILE
====================================================== */

@media (max-width: 850px) {

    .collection-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(0, 1fr)
            );
    }

}


@media (max-width: 600px) {

    .page {

        padding:
            20px 15px 45px;
    }


    header {

        align-items: flex-start;

        flex-direction: column;

        margin-bottom: 38px;
    }


    nav {

        width: 100%;

        justify-content: flex-start;

        gap: 15px;
    }


    h1 {

        letter-spacing: 4px;
    }


    .hero {

        margin-bottom: 32px;
    }


    .collection-grid {

        grid-template-columns: 1fr;
    }


    .collection-card {

        min-height: 220px;
    }

}

</style>

</head>


<body>


<div class="page">


<!-- ====================================================
     HEADER
===================================================== -->

<header>

    <div class="brand">
        AETHERVERSE
    </div>


    <nav>

        <a href="halo-home.html">
            MY HALO
        </a>

        <a href="explore.html">
            EXPLORE
        </a>

        <a href="codex.html">
            CODEX
        </a>

        <a href="community.html">
            COMMUNITY
        </a>

        <a href="#" id="logoutButton">
            LOG OUT
        </a>

    </nav>

</header>


<!-- ====================================================
     HERO
===================================================== -->

<section class="hero">

    <div class="eyebrow">
        YOUR PRIVATE AETHER ARCHIVE
    </div>


    <h1>
        MY COLLECTION
    </h1>


    <p>
        The memories, stories and special moments you have
        discovered throughout the AETHERVERSE.
    </p>

</section>


<!-- ====================================================
     COLLECTION COUNTER
===================================================== -->

<div
    id="collectionCounter"
    class="collection-counter">

    0 / 8 COLLECTION ITEMS

</div>


<!-- ====================================================
     FILTERS
===================================================== -->

<div class="filters">

    <button
        class="filter-button active"
        data-filter="ALL">

        ALL

    </button>


    <button
        class="filter-button"
        data-filter="BACKSTAGE">

        BACKSTAGE

    </button>


    <button
        class="filter-button"
        data-filter="BONDS">

        BONDS

    </button>


    <button
        class="filter-button"
        data-filter="STORIES">

        STORIES

    </button>


    <button
        class="filter-button"
        data-filter="MEMORIES">

        MEMORIES

    </button>


    <button
        class="filter-button"
        data-filter="HIDDEN">

        HIDDEN

    </button>


    <button
        class="filter-button"
        data-filter="SPECIAL">

        SPECIAL

    </button>

</div>


<!-- ====================================================
     STATUS
===================================================== -->

<div
    id="status"
    class="status">

    Loading your collection...

</div>


<!-- ====================================================
     COLLECTION
===================================================== -->

<main id="collectionContainer"></main>


</div>


<script>


// ======================================================
// SUPABASE
// ======================================================

const SUPABASE_URL =
    "https://mkdkfnejqnqoalzyeqaw.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_uScqa4BUx4rq0lEmkVO-8Q_QsiyetmY";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ======================================================
// CONSTANTS
// ======================================================

const TOTAL_COLLECTION_ITEMS = 8;


// ======================================================
// STATE
// ======================================================

let currentUser = null;

let collectionItems = [];

let currentFilter = "ALL";


// ======================================================
// DOM
// ======================================================

const statusElement =
    document.getElementById(
        "status"
    );


const collectionContainer =
    document.getElementById(
        "collectionContainer"
    );


const collectionCounter =
    document.getElementById(
        "collectionCounter"
    );


const filterButtons =
    document.querySelectorAll(
        ".filter-button"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


// ======================================================
// AUTH CHECK
// ======================================================

async function checkSession() {

    const {
        data,
        error
    } =
    await db.auth.getSession();


    if (error) {

        console.error(
            "Session error:",
            error
        );


        window.location.replace(
            "halo.html"
        );


        return;
    }


    if (!data.session) {

        window.location.replace(
            "halo.html"
        );


        return;
    }


    currentUser =
        data.session.user;


    await loadCollection();
}


// ======================================================
// LOAD COLLECTION
// ======================================================

async function loadCollection() {

    setStatus(
        "Loading your collection..."
    );


    /*
      IMPORTANT:

      The collection is determined ONLY by
      aether_collection_ownership.

      user_id = current HALO.

      This means one HALO can never see another
      HALO's private collection through this query.
    */

    const {
        data,
        error
    } =
    await db

        .from(
            "aether_collection_ownership"
        )

        .select(`
            id,
            acquired_at,
            source_type,
            source_key,
            visibility,
            aether_collection_items (
                id,
                title,
                description,
                category,
                content_type,
                content_data,
                is_active,
                created_at
            )
        `)

        .eq(
            "user_id",
            currentUser.id
        )

        .order(
            "acquired_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "Collection error:",
            error
        );


        setStatus(
            "Unable to load your collection.",
            true
        );


        collectionContainer.innerHTML = "";

        return;
    }


    /*
      Only active collection items are displayed.
    */

    collectionItems =
        (data || [])
            .filter(
                ownership => {

                    const item =
                        ownership
                            .aether_collection_items;

                    return (
                        item &&
                        item.is_active === true
                    );

                }
            );


    updateCollectionCounter();

    renderCollection();
}


// ======================================================
// COLLECTION COUNTER
// ======================================================

function updateCollectionCounter() {

    collectionCounter.textContent =
        `${collectionItems.length} / ${TOTAL_COLLECTION_ITEMS} COLLECTION ITEMS`;
}


// ======================================================
// RENDER COLLECTION
// ======================================================

function renderCollection() {

    const filteredItems =
        currentFilter === "ALL"

            ? collectionItems

            : collectionItems.filter(
                ownership => {

                    const item =
                        ownership
                            .aether_collection_items;


                    return (
                        item.category ===
                        currentFilter
                    );

                }
            );


    // --------------------------------------------------
    // EMPTY
    // --------------------------------------------------

    if (!filteredItems.length) {

        collectionContainer.innerHTML = `

            <div class="empty-state">

                <h2>
                    NOTHING HERE YET
                </h2>

                <p>
                    Your AETHERVERSE collection is waiting
                    for its first memory.
                </p>

            </div>

        `;


        if (collectionItems.length > 0) {

            setStatus(
                `${collectionItems.length} collection item${collectionItems.length === 1 ? "" : "s"}`
            );

        } else {

            setStatus("");

        }

        return;
    }


    // --------------------------------------------------
    // GRID
    // --------------------------------------------------

    collectionContainer.innerHTML = `

        <div class="collection-grid"></div>

    `;


    const grid =
        collectionContainer.querySelector(
            ".collection-grid"
        );


    filteredItems.forEach(
        ownership => {

            const item =
                ownership
                    .aether_collection_items;


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "collection-card";


            // --------------------------------------------------
            // CATEGORY
            // --------------------------------------------------

            const category =
                document.createElement(
                    "div"
                );


            category.className =
                "card-category";


            category.textContent =
                item.category;


            // --------------------------------------------------
            // TITLE
            // --------------------------------------------------

            const title =
                document.createElement(
                    "h2"
                );


            title.textContent =
                item.title;


            // --------------------------------------------------
            // DESCRIPTION
            // --------------------------------------------------

            const description =
                document.createElement(
                    "p"
                );


            description.textContent =
                item.description ||
                "A discovered AETHER memory.";


            // --------------------------------------------------
            // META
            // --------------------------------------------------

            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "card-meta";


            const type =
                document.createElement(
                    "span"
                );


            type.textContent =
                item.content_type;


            const visibility =
                document.createElement(
                    "span"
                );


            visibility.textContent =
                ownership.visibility;


            meta.appendChild(
                type
            );


            meta.appendChild(
                visibility
            );


            // --------------------------------------------------
            // ASSEMBLE
            // --------------------------------------------------

            card.appendChild(
                category
            );


            card.appendChild(
                title
            );


            card.appendChild(
                description
            );


            card.appendChild(
                meta
            );


            grid.appendChild(
                card
            );

        }
    );


    setStatus(
        `${filteredItems.length} collection item${filteredItems.length === 1 ? "" : "s"}`
    );
}


// ======================================================
// FILTERS
// ======================================================

filterButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                currentFilter =
                    button.dataset.filter;


                filterButtons.forEach(
                    otherButton => {

                        otherButton.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );


                renderCollection();

            }
        );

    }
);


// ======================================================
// LOG OUT
// ======================================================

logoutButton.addEventListener(
    "click",
    async event => {

        event.preventDefault();


        const {
            error
        } =
        await db.auth.signOut();


        if (error) {

            console.error(
                "Logout error:",
                error
            );


            return;
        }


        window.location.replace(
            "halo.html"
        );

    }
);


// ======================================================
// STATUS
// ======================================================

function setStatus(
    message,
    isError = false
) {

    statusElement.textContent =
        message;


    statusElement.classList.toggle(
        "error",
        isError
    );

}


// ======================================================
// START
// ======================================================

checkSession();

</script>


</body>

</html>
