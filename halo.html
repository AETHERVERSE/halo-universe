<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HALO Login | AETHERVERSE</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #30275f 0%,
            #0f0d2b 45%,
            #080719 100%
        );

    color: #ddd7ff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;
}


.container {

    width: 100%;

    max-width: 520px;

    margin: auto;
}


/* =========================
   HEADER
========================= */

header {

    text-align: center;

    margin-bottom: 35px;
}


.logo {

    color: #aaa0e6;

    font-size: 0.8rem;

    letter-spacing: 6px;

    margin-bottom: 20px;
}


.symbol {

    font-size: 3rem;

    margin-bottom: 10px;
}


h1 {

    margin:
        5px
        0
        12px;

    color: #eeeaff;

    font-size: 2.2rem;

    letter-spacing: 4px;
}


.subtitle {

    color: #aaa0e6;

    line-height: 1.7;

    font-size: 0.95rem;
}


/* =========================
   LOGIN CARD
========================= */

.login-card {

    background:
        linear-gradient(
            145deg,
            #252052,
            #181633
        );

    border:
        1px solid
        #514879;

    border-radius: 24px;

    padding:
        35px
        30px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.35);

    text-align: center;
}


.card-title {

    color: #eeeaff;

    font-size: 1.35rem;

    letter-spacing: 3px;

    margin-bottom: 10px;
}


.card-description {

    color: #aaa0e6;

    line-height: 1.7;

    font-size: 0.9rem;

    margin-bottom: 28px;
}


/* =========================
   FORM
========================= */

.form-group {

    text-align: left;

    margin-bottom: 18px;
}


label {

    display: block;

    color: #cfc8e8;

    font-size: 0.8rem;

    letter-spacing: 1.5px;

    margin-bottom: 8px;
}


input {

    width: 100%;

    padding:
        13px
        15px;

    border:
        1px solid
        #514879;

    border-radius: 12px;

    background:
        #0e0c25;

    color:
        #eeeaff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        0.95rem;

    outline:
        none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}


input:focus {

    border-color:
        #9c8fe0;

    box-shadow:
        0 0 0 3px
        rgba(156,143,224,0.12);
}


input::placeholder {

    color:
        #68627f;
}


/* =========================
   MAIN BUTTON
========================= */

.login-button {

    width: 100%;

    margin-top: 8px;

    padding:
        14px
        20px;

    border:
        1px solid
        #9c8fe0;

    border-radius: 28px;

    background:
        linear-gradient(
            90deg,
            #7665b8,
            #cdb9ff
        );

    color:
        #100d25;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        0.85rem;

    font-weight:
        bold;

    letter-spacing:
        2px;

    cursor:
        pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
}


.login-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(160,140,220,0.25);
}


.login-button:disabled {

    cursor:
        default;

    opacity:
        0.65;

    transform:
        none;

    box-shadow:
        none;
}


/* =========================
   SWITCH
========================= */

.switch-area {

    margin-top:
        25px;

    padding-top:
        22px;

    border-top:
        1px solid
        #39345e;

    color:
        #aaa0e6;

    font-size:
        0.8rem;

    line-height:
        1.7;
}


.switch-button {

    margin-top:
        8px;

    padding:
        8px
        15px;

    border:
        1px solid
        #514879;

    border-radius:
        20px;

    background:
        transparent;

    color:
        #ddd7ff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        0.78rem;

    letter-spacing:
        1px;

    cursor:
        pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease;
}


.switch-button:hover {

    background:
        #29264b;

    border-color:
        #8f84c9;
}


/* =========================
   STATUS
========================= */

.status {

    min-height:
        24px;

    margin-top:
        20px;

    color:
        #c8bdff;

    font-size:
        0.8rem;

    line-height:
        1.6;
}


.status.error {

    color:
        #d9a7b5;
}


.status.success {

    color:
        #cdb9ff;
}


/* =========================
   BACK LINK
========================= */

.back-link {

    display:
        inline-block;

    margin-top:
        25px;

    color:
        #aaa0e6;

    text-decoration:
        none;

    font-size:
        0.78rem;

    letter-spacing:
        1px;
}


.back-link:hover {

    color:
        #eeeaff;
}


/* =========================
   FOOTER
========================= */

footer {

    text-align:
        center;

    margin-top:
        30px;

    color:
        #77739e;

    font-size:
        0.7rem;

    letter-spacing:
        2px;

    line-height:
        2;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    body {

        align-items:
            flex-start;

        padding-top:
            35px;
    }


    .login-card {

        padding:
            30px
            22px;
    }


    h1 {

        font-size:
            1.8rem;

        letter-spacing:
            3px;
    }

}

</style>

</head>


<body>


<div class="container">


<header>

<div class="logo">
AETHERVERSE
</div>


<div class="symbol">
✦
</div>


<h1>
HALO
</h1>


<p class="subtitle">

Your place among the seven stars.

<br>

Enter the AETHER universe.

</p>

</header>



<section class="login-card">


<div
id="cardTitle"
class="card-title">

WELCOME BACK, HALO

</div>


<div
id="cardDescription"
class="card-description">

Sign in to continue your journey
through AETHER.

</div>



<!-- =========================
     FORM
========================= -->

<form
id="authForm">


<div class="form-group">

<label for="email">
EMAIL
</label>


<input
type="email"
id="email"
placeholder="Enter your email"
autocomplete="email"
required>

</div>



<div class="form-group">

<label for="password">
PASSWORD
</label>


<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
required>

</div>



<div
id="confirmGroup"
class="form-group"
style="display:none;">

<label for="confirmPassword">
CONFIRM PASSWORD
</label>


<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
autocomplete="new-password">

</div>



<button
type="submit"
id="authButton"
class="login-button">

✦ ENTER AETHER

</button>


</form>



<div
id="status"
class="status">
</div>



<div class="switch-area">

<div id="switchText">

New to the AETHERVERSE?

</div>


<button
type="button"
id="switchButton"
class="switch-button">

CREATE YOUR HALO

</button>

</div>



<a
href="index.html"
class="back-link">

← RETURN TO AETHERVERSE

</a>


</section>



<footer>

ONE LIGHT • SEVEN STARS • ENDLESS LOVE

<br><br>

#WEAREHALO • #WEAREAETHER

</footer>


</div>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://mkdkfnejqnqoalzyeqaw.supabase.co";


const SUPABASE_KEY =
"sb_publishable_uScqa4BUx4rq0lEmkVO-8Q_QsiyetmY";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =========================
   ELEMENTS
========================= */

const authForm =
document.getElementById(
    "authForm"
);


const emailInput =
document.getElementById(
    "email"
);


const passwordInput =
document.getElementById(
    "password"
);


const confirmPasswordInput =
document.getElementById(
    "confirmPassword"
);


const confirmGroup =
document.getElementById(
    "confirmGroup"
);


const authButton =
document.getElementById(
    "authButton"
);


const switchButton =
document.getElementById(
    "switchButton"
);


const switchText =
document.getElementById(
    "switchText"
);


const cardTitle =
document.getElementById(
    "cardTitle"
);


const cardDescription =
document.getElementById(
    "cardDescription"
);


const status =
document.getElementById(
    "status"
);



/* =========================
   MODE
========================= */

let isSignupMode =
false;



/* =========================
   REDIRECT
========================= */

function goToHaloHome() {

    window.location.replace(
        "halo-home.html"
    );

}



/* =========================
   SHOW STATUS
========================= */

function showStatus(
    message,
    type = ""
) {

    status.textContent =
        message;

    status.className =
        "status";

    if (type) {

        status.classList.add(
            type
        );

    }

}



/* =========================
   SWITCH MODE
========================= */

function updateAuthMode() {

    if (isSignupMode) {

        cardTitle.textContent =
            "CREATE YOUR HALO";

        cardDescription.textContent =
            "Create your HALO identity and begin your journey through AETHER.";

        confirmGroup.style.display =
            "block";

        confirmPasswordInput.required =
            true;

        authButton.textContent =
            "✦ CREATE HALO";

        switchText.textContent =
            "Already have a HALO account?";

        switchButton.textContent =
            "SIGN IN";

    }

    else {

        cardTitle.textContent =
            "WELCOME BACK, HALO";

        cardDescription.textContent =
            "Sign in to continue your journey through AETHER.";

        confirmGroup.style.display =
            "none";

        confirmPasswordInput.required =
            false;

        authButton.textContent =
            "✦ ENTER AETHER";

        switchText.textContent =
            "New to the AETHERVERSE?";

        switchButton.textContent =
            "CREATE YOUR HALO";

    }


    showStatus("");

    passwordInput.value =
        "";

    confirmPasswordInput.value =
        "";

}



switchButton.addEventListener(
    "click",
    function() {

        isSignupMode =
            !isSignupMode;

        updateAuthMode();

    }
);



/* =========================
   CHECK EXISTING SESSION
========================= */

async function checkExistingSession() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "HALO SESSION ERROR:",
                error
            );

            return;

        }


        const session =
            data &&
            data.session
                ? data.session
                : null;


        if (
            session &&
            session.user
        ) {

            goToHaloHome();

        }

    }

    catch (error) {

        console.error(
            "HALO SESSION CHECK ERROR:",
            error
        );

    }

}



/* =========================
   LOGIN / SIGNUP
========================= */

authForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if (
            !email ||
            !password
        ) {

            showStatus(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        if (
            isSignupMode
        ) {

            const confirmPassword =
                confirmPasswordInput.value;


            if (
                password !==
                confirmPassword
            ) {

                showStatus(
                    "Your passwords do not match.",
                    "error"
                );

                return;

            }


            if (
                password.length < 6
            ) {

                showStatus(
                    "Your password must contain at least 6 characters.",
                    "error"
                );

                return;

            }

        }


        authButton.disabled =
            true;


        if (
            isSignupMode
        ) {

            authButton.textContent =
                "CREATING YOUR HALO...";

        }

        else {

            authButton.textContent =
                "ENTERING AETHER...";

        }


        showStatus("");


        try {


            /* =========================
               SIGN UP
            ========================= */

            if (
                isSignupMode
            ) {

                const {
                    data,
                    error
                } =
                await supabaseClient.auth.signUp(
                    {
                        email:
                            email,

                        password:
                            password
                    }
                );


                if (error) {

                    console.error(
                        "HALO SIGNUP ERROR:",
                        error
                    );

                    showStatus(
                        error.message,
                        "error"
                    );

                    authButton.disabled =
                        false;

                    authButton.textContent =
                        "✦ CREATE HALO";

                    return;

                }


                /*
                 * Supabase may require
                 * email confirmation.
                 */

                if (
                    data &&
                    data.session
                ) {

                    showStatus(
                        "✦ Your HALO has been created. Entering AETHER...",
                        "success"
                    );

                    setTimeout(
                        goToHaloHome,
                        500
                    );

                    return;

                }


                showStatus(
                    "✦ Your HALO has been created. Please check your email to confirm your account.",
                    "success"
                );


                authButton.disabled =
                    false;

                authButton.textContent =
                    "✦ CREATE HALO";


                return;

            }



            /* =========================
               LOGIN
            ========================= */

            const {
                data,
                error
            } =
            await supabaseClient.auth.signInWithPassword(
                {
                    email:
                        email,

                    password:
                        password
                }
            );


            if (error) {

                console.error(
                    "HALO LOGIN ERROR:",
                    error
                );

                showStatus(
                    "Login failed. Please check your email and password.",
                    "error"
                );

                authButton.disabled =
                    false;

                authButton.textContent =
                    "✦ ENTER AETHER";

                return;

            }


            if (
                data &&
                data.user
            ) {

                showStatus(
                    "✦ Welcome back, HALO. Entering AETHER...",
                    "success"
                );


                setTimeout(
                    goToHaloHome,
                    500
                );

                return;

            }


            showStatus(
                "Could not start your HALO session. Please try again.",
                "error"
            );


            authButton.disabled =
                false;

            authButton.textContent =
                "✦ ENTER AETHER";


        }

        catch (error) {

            console.error(
                "HALO AUTH ERROR:",
                error
            );

            showStatus(
                "Something went wrong. Please try again.",
                "error"
            );


            authButton.disabled =
                false;


            authButton.textContent =
                isSignupMode
                    ? "✦ CREATE HALO"
                    : "✦ ENTER AETHER";

        }

    }
);



/* =========================
   START
========================= */

checkExistingSession();


</script>

</body>

</html>
