<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday — AETHER × HALO</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 10%,rgba(120,80,255,.22),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(0,210,255,.18),transparent 30%),
    linear-gradient(135deg,#070914,#11152d 55%,#080b18);
}

header{
  padding:28px 20px 18px;
  text-align:center;
}

h1{
  margin:0;
  font-size:2.2rem;
  letter-spacing:4px;
}

.subtitle{
  margin-top:8px;
  opacity:.75;
}

nav{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  padding:0 20px 25px;
}

nav a{
  color:#fff;
  text-decoration:none;
  padding:10px 18px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  background:rgba(255,255,255,.06);
}

.container{
  max-width:1100px;
  margin:auto;
  padding:0 18px 50px;
}

.admin-preview{
  display:none;
  margin:0 auto 25px;
  padding:18px;
  border:1px solid #ffcf55;
  border-radius:18px;
  background:rgba(255,190,40,.1);
}

.admin-preview.show{
  display:block;
}

.admin-preview h2{
  margin-top:0;
  color:#ffd76a;
}

.admin-controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.admin-controls select{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.25);
  background:#15192e;
  color:#fff;
}

.preview-badge{
  display:inline-block;
  margin-top:12px;
  padding:7px 12px;
  border-radius:999px;
  background:#6f4cff;
  font-size:.8rem;
  font-weight:bold;
  letter-spacing:1px;
}

.error-box{
  display:none;
  margin-bottom:20px;
  padding:15px;
  border-radius:14px;
  background:rgba(255,60,80,.12);
  border:1px solid rgba(255,80,100,.4);
  color:#ffb8c0;
}

.error-box.show{
  display:block;
}

.members{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  position:relative;
  overflow:hidden;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);
  box-shadow:0 12px 35px rgba(0,0,0,.25);
  transition:.25s ease;
}

.card.open{
  cursor:pointer;
}

.card.open:hover{
  transform:translateY(-5px);
  border-color:rgba(255,255,255,.35);
}

.card.locked{
  opacity:.72;
}

.card-image{
  height:240px;
  background-size:cover;
  background-position:center;
  background-color:#171b31;
}

.card-content{
  padding:18px;
}

.member-name{
  font-size:1.5rem;
  font-weight:bold;
  margin-bottom:6px;
}

.birthday-date{
  font-weight:bold;
  margin-bottom:12px;
}

.status{
  font-size:.9rem;
  opacity:.8;
  line-height:1.5;
}

.lock{
  position:absolute;
  top:15px;
  right:15px;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  font-size:20px;
}

.timer{
  margin-top:12px;
  font-weight:bold;
}

.birthday-panel{
  display:none;
  margin-top:25px;
  padding:25px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.08);
}

.birthday-panel.show{
  display:block;
}

.panel-header{
  margin-bottom:20px;
}

.panel-header h2{
  margin:0 0 7px;
}

.collection{
  margin-top:20px;
  padding:20px;
  border-radius:18px;
  background:rgba(0,0,0,.18);
}

.collection button,
.wish-form button{
  border:0;
  padding:12px 18px;
  border-radius:999px;
  cursor:pointer;
  font-weight:bold;
  color:#fff;
  background:linear-gradient(135deg,#7657ff,#26b8ff);
}

.collection button:disabled,
.wish-form button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  padding:14px;
  margin:10px 0;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.25);
  color:#fff;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){
  h1{font-size:1.7rem}
  .card-image{height:210px}
}
</style>
</head>

<body>

<header>
  <h1>🎂 BIRTHDAY</h1>
  <div class="subtitle">AETHER × HALO — Birthday Moments</div>
</header>

<nav>
  <a href="my-halo.html">MY HALO</a>
  <a href="card-album.html">CARD ALBUM</a>
</nav>

<main class="container">

  <div id="errorBox" class="error-box"></div>

  <section id="adminPreview" class="admin-preview">
    <h2>🛠️ ADMIN PREVIEW</h2>
    <div>This preview is visible only to AETHER admins and does <strong>not</strong> activate the real birthday event.</div>

    <div class="admin-controls">
      <label for="previewMember">Member:</label>

      <select id="previewMember">
        <option value="solen">Solen</option>
        <option value="vex">Vex</option>
        <option value="kairo">Kairo</option>
        <option value="riven" selected>Riven</option>
        <option value="zenith">Zenith</option>
        <option value="lux">Lux</option>
        <option value="nero">Nero</option>
      </select>
    </div>

    <span class="preview-badge">ADMIN PREVIEW — NOT LIVE</span>
  </section>

  <section id="members" class="members"></section>

  <section id="birthdayPanel" class="birthday-panel"></section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://mkdkfnejqnqoalzyeqaw.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const members = [
  {key:"solen",name:"Solen",birthday:"20.12",month:12,day:20},
  {key:"vex",name:"Vex",birthday:"30.03",month:3,day:30},
  {key:"kairo",name:"Kairo",birthday:"14.05",month:5,day:14},
  {key:"riven",name:"Riven",birthday:"22.09",month:9,day:22},
  {key:"zenith",name:"Zenith",birthday:"07.07",month:7,day:7},
  {key:"lux",name:"Lux",birthday:"27.02",month:2,day:27},
  {key:"nero",name:"Nero",birthday:"01.11",month:11,day:1}
];

let events = [];
let currentEvent = null;
let serverTimeOffset = 0;
let isAdmin = false;
let adminTestMember = null;

const params = new URLSearchParams(window.location.search);
const requestedPreview =
  params.get("test")?.toLowerCase() === "riven" ||
  params.get("preview")?.toLowerCase() === "riven";

function showError(message){
  const box = document.getElementById("errorBox");
  box.textContent = message;
  box.classList.add("show");
}

async function syncServerClock(){
  try{
    const before = Date.now();

    const {data,error} =
      await supabaseClient.rpc("get_server_time");

    const after = Date.now();

    if(error) throw error;

    const serverMs = new Date(data).getTime();
    const midpoint = (before + after) / 2;

    serverTimeOffset = serverMs - midpoint;
  }catch(error){
    console.error("Server clock error:",error);
    serverTimeOffset = 0;
  }
}

function serverNow(){
  return new Date(Date.now() + serverTimeOffset);
}

function formatRemaining(ms){
  if(ms <= 0) return "00:00:00";

  const totalSeconds = Math.floor(ms / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  return (
    (days > 0 ? days + "d " : "") +
    String(hours).padStart(2,"0") + ":" +
    String(minutes).padStart(2,"0") + ":" +
    String(seconds).padStart(2,"0")
  );
}

function eventState(event){

  if(!event) return "locked";

  const now = serverNow();
  const start = new Date(event.start_at);
  const end = new Date(event.end_at);

  if(now < start) return "upcoming";
  if(now >= start && now < end) return "live";

  return "expired";
}

function previewState(member){

  if(
    isAdmin &&
    adminTestMember &&
    adminTestMember.member_key === member.key
  ){
    return "live";
  }

  return null;
}

function getMemberEvent(memberKey){
  return events.find(e => e.member_key === memberKey) || null;
}

function renderMembers(){

  const container = document.getElementById("members");
  container.innerHTML = "";

  members.forEach(member => {

    const event = getMemberEvent(member.key);

    let state = eventState(event);

    const preview = previewState(member);

    if(preview){
      state = preview;
    }

    let imageUrl =
      event?.snapshot_url ||
      "images/file_00000000c1b88243828f3bb7fe1cc29a.png";

    let statusText = "";
    let timer = "";

    if(state === "upcoming"){

      const start = new Date(event.start_at);
      const remaining = start - serverNow();

      statusText = "🔒 Opens on " + member.birthday;
      timer =
        `<div class="timer">Opens in ${formatRemaining(remaining)}</div>`;

    }else if(state === "live"){

      const end = event
        ? new Date(event.end_at)
        : new Date(serverNow().getTime() + 72*60*60*1000);

      const remaining = end - serverNow();

      statusText = preview
        ? "🛠️ Admin preview — simulated 72-hour birthday event"
        : "🎉 Birthday event is LIVE!";

      timer =
        `<div class="timer">⏳ ${formatRemaining(remaining)} remaining</div>`;

    }else{

      statusText = "🔒 Birthday event expired.";
    }

    const card = document.createElement("article");

    card.className =
      "card " + (state === "live" ? "open" : "locked");

    card.innerHTML = `
      <div
        class="card-image"
        style="background-image:url('${imageUrl}')">
      </div>

      ${
        state !== "live"
          ? `<div class="lock">🔒</div>`
          : `<div class="lock">🎂</div>`
      }

      <div class="card-content">

        <div class="member-name">
          ${member.name}
        </div>

        <div class="birthday-date">
          ${member.birthday} Birthday
        </div>

        <div class="status">
          ${statusText}
          ${timer}
        </div>

      </div>
    `;

    card.addEventListener("click",() => {

      if(state === "live"){

        openBirthday(member,event,Boolean(preview));

      }

    });

    container.appendChild(card);
  });
}

function openBirthday(member,event,isPreview){

  const panel = document.getElementById("birthdayPanel");

  currentEvent = event;

  const realEventState = eventState(event);

  if(
    !isPreview &&
    realEventState !== "live"
  ){
    return;
  }

  const previewActive =
    isPreview &&
    isAdmin &&
    adminTestMember &&
    adminTestMember.member_key === member.key;

  panel.classList.add("show");

  panel.innerHTML = `

    <div class="panel-header">

      <h2>🎂 ${member.name} — Birthday ${member.birthday}</h2>

      ${
        previewActive
          ? `<div class="preview-badge">ADMIN PREVIEW — NOT LIVE</div>`
          : `<div>Welcome to ${member.name}'s birthday moment. 💫</div>`
      }

    </div>

    <div class="collection">

      <h3>🎁 Birthday Collection</h3>

      ${
        previewActive
          ? `
            <p>
              Preview mode is active. The real card cannot be claimed here.
            </p>

            <button disabled>
              🔒 Preview — Claim Disabled
            </button>
          `
          : `
            <p>
              This special birthday card is available only during the
              72-hour birthday event.
            </p>

            <button id="claimButton">
              🎁 Claim Birthday Card
            </button>
          `
      }

    </div>

    <div class="collection">

      <h3>💌 Birthday Wishes</h3>

      <div id="wishList">
        Loading wishes...
      </div>

      ${
        previewActive
          ? `
            <p style="opacity:.7">
              Wish submission is disabled during admin preview.
            </p>
          `
          : `
            <div class="wish-form">

              <textarea
                id="wishMessage"
                maxlength="500"
                placeholder="Write a birthday message for ${member.name}...">
              </textarea>

              <button id="wishButton">
                💌 Send Birthday Wish
              </button>

            </div>
          `
      }

    </div>
  `;

  loadWishes(event?.id);

  if(!previewActive){

    document
      .getElementById("claimButton")
      ?.addEventListener("click",claimBirthdayCard);

    document
      .getElementById("wishButton")
      ?.addEventListener("click",sendWish);
  }

  panel.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}

async function loadWishes(eventId){

  const list = document.getElementById("wishList");

  if(!list || !eventId) return;

  const {data,error} =
    await supabaseClient
      .from("birthday_wishes")
      .select("message,created_at")
      .eq("event_id",eventId)
      .order("created_at",{ascending:false});

  if(error){

    list.textContent = "Could not load wishes.";
    console.error(error);
    return;
  }

  if(!data || data.length === 0){

    list.innerHTML =
      `<div style="opacity:.65">No wishes yet. Be the first! 💜</div>`;

    return;
  }

  list.innerHTML = data.map(wish => `

    <div style="
      padding:12px;
      margin-bottom:10px;
      border-radius:12px;
      background:rgba(255,255,255,.06)
    ">

      ${escapeHtml(wish.message)}

    </div>

  `).join("");
}

function escapeHtml(text){

  return String(text ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function claimBirthdayCard(){

  if(!currentEvent) return;

  const button = document.getElementById("claimButton");

  if(button){
    button.disabled = true;
    button.textContent = "Claiming...";
  }

  const {data,error} =
    await supabaseClient
      .rpc(
        "claim_birthday_card",
        {
          p_event_id:currentEvent.id
        }
      );

  if(error){

    console.error(error);

    alert(
      error.message ||
      "The birthday card could not be claimed."
    );

    if(button){
      button.disabled = false;
      button.textContent = "🎁 Claim Birthday Card";
    }

    return;
  }

  alert(
    "🎉 Birthday card claimed successfully!"
  );

  if(button){
    button.textContent = "✅ Claimed";
  }
}

async function sendWish(){

  if(!currentEvent) return;

  const textarea =
    document.getElementById("wishMessage");

  const button =
    document.getElementById("wishButton");

  const message =
    textarea?.value.trim();

  if(!message){

    alert("Please write a birthday message first. 💌");
    return;
  }

  if(button){
    button.disabled = true;
    button.textContent = "Sending...";
  }

  const {error} =
    await supabaseClient
      .rpc(
        "submit_birthday_wish",
        {
          p_event_id:currentEvent.id,
          p_message:message
        }
      );

  if(error){

    console.error(error);

    alert(
      error.message ||
      "Your birthday wish could not be sent."
    );

    if(button){
      button.disabled = false;
      button.textContent = "💌 Send Birthday Wish";
    }

    return;
  }

  textarea.value = "";

  alert("💌 Birthday wish sent!");

  loadWishes(currentEvent.id);

  if(button){
    button.disabled = false;
    button.textContent = "💌 Send Birthday Wish";
  }
}

async function checkAdminAccess(){

  try{

    const {data,error} =
      await supabaseClient
        .rpc("is_aether_admin");

    if(error) throw error;

    isAdmin = data === true;

    if(isAdmin){

      document
        .getElementById("adminPreview")
        .classList.add("show");

      const select =
        document.getElementById("previewMember");

      adminTestMember =
        members.find(
          m => m.key === select.value
        ) || members.find(
          m => m.key === "riven"
        );

      if(requestedPreview){

        select.value = "riven";

        adminTestMember =
          members.find(
            m => m.key === "riven"
          );
      }

    }else if(requestedPreview){

      showError(
        "Admin preview requested, but this account is not recognized as an AETHER admin."
      );
    }

  }catch(error){

    console.error("Admin access error:",error);

    isAdmin = false;

    if(requestedPreview){

      showError(
        "Admin preview could not be checked. Please make sure you are logged in and the admin RPC is available."
      );
    }
  }
}

function startAdminPreview(){

  if(!isAdmin) return;

  const select =
    document.getElementById("previewMember");

  select.addEventListener("change",() => {

    adminTestMember =
      members.find(
        m => m.key === select.value
      );

    renderMembers();

    const event =
      getMemberEvent(adminTestMember.key);

    openBirthday(
      adminTestMember,
      event,
      true
    );
  });

  if(requestedPreview){

    const event =
      getMemberEvent("riven");

    openBirthday(
      members.find(
        m => m.key === "riven"
      ),
      event,
      true
    );
  }
}

async function load(){

  await syncServerClock();

  await checkAdminAccess();

  const {data,error} =
    await supabaseClient
      .from("birthday_events")
      .select("*")
      .eq("is_active",true)
      .order("birthday_date");

  if(error){

    console.error(error);

    showError(
      "Birthday events could not be loaded."
    );

    return;
  }

  events = data || [];

  renderMembers();

  startAdminPreview();

}

setInterval(async() => {

  await syncServerClock();

  renderMembers();

},5 * 60 * 1000);

setInterval(() => {

  renderMembers();

  if(
    currentEvent &&
    document
      .getElementById("birthdayPanel")
      ?.classList.contains("show")
  ){

    const member =
      members.find(
        m => m.key === currentEvent.member_key
      );

    if(member){

      const preview =
        isAdmin &&
        adminTestMember?.member_key === member.key;

      openBirthday(
        member,
        currentEvent,
        preview
      );
    }
  }

},1000);

load();
</script>

</body>
</html>
