<html lang="en">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
color:#eeeaff;
font-family:Georgia,serif;
background:radial-gradient(circle at top,#30275f 0%,#12102c 45%,#0b0920 100%)
}

.container{
max-width:820px;
margin:auto;
padding:28px 16px 60px
}

header{
text-align:center;
margin-bottom:30px
}

.logo{
letter-spacing:6px;
font-size:.75rem;
color:#aaa0e6;
margin-bottom:18px
}

nav{
display:flex;
justify-content:center;
gap:9px;
flex-wrap:wrap
}

nav a{
color:#ddd7ff;
text-decoration:none;
border:1px solid #39345e;
border-radius:25px;
padding:8px 16px;
font-size:.78rem;
transition:.2s
}

nav a:hover{
background:#29264b;
border-color:#9c8fe0
}

.hero{
text-align:center;
margin:28px 0
}

.icon{
font-size:3.2rem
}

.label{
color:#aaa0e6;
font-size:.75rem;
letter-spacing:4px;
margin-top:10px
}

h1{
font-size:2rem;
letter-spacing:4px;
margin:8px 0
}

.subtitle{
color:#aaa0e6;
line-height:1.7
}

.card{
background:linear-gradient(145deg,rgba(48,42,92,.96),rgba(20,18,49,.98));
border:1px solid #514879;
border-radius:24px;
padding:24px;
box-shadow:0 20px 50px rgba(0,0,0,.35)
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:22px
}

.tab{
border:1px solid #514879;
background:#211d43;
color:#aaa0e6;
border-radius:22px;
padding:9px 20px;
cursor:pointer;
font-family:Georgia,serif
}

.tab.active{
background:#5d508e;
color:white;
border-color:#9c8fe0
}

table{
width:100%;
border-collapse:collapse
}

th,td{
padding:14px 8px;
text-align:left;
border-bottom:1px solid #302b50
}

th{
color:#77739e;
font-size:.7rem;
letter-spacing:2px
}

td{
font-size:.88rem
}

.rank{
text-align:center;
width:60px;
color:#cdb9ff
}

.score{
text-align:right;
color:#eeeaff;
font-weight:bold
}

.you{
background:rgba(93,80,142,.22)
}

.empty{
text-align:center;
color:#77739e;
padding:30px;
line-height:1.7
}

.me{
text-align:center;
margin-top:20px;
color:#aaa0e6;
font-size:.8rem
}

.actions{
text-align:center;
margin-top:25px
}

.action{
display:inline-block;
text-decoration:none;
color:#ddd7ff;
border:1px solid #8f84c9;
border-radius:25px;
padding:10px 18px;
font-size:.75rem;
letter-spacing:1px;
transition:.2s
}

.action:hover{
background:#29264b;
border-color:#cdb9ff
}

footer{
text-align:center;
margin-top:40px;
color:#77739e;
font-size:.65rem;
letter-spacing:2px;
line-height:2
}

@media(max-width:600px){
h1{
font-size:1.6rem
}

.card{
padding:16px
}

th,td{
padding:11px 5px;
font-size:.78rem
}
}
</style>
</head>

<body>

<div class="container">

<header>

<div class="logo">
AETHERVERSE
</div>

<nav>

<a href="halo-home.html">
MY HALO
</a>

<a href="aether-arcade.html">
AETHER ARCADE
</a>

<a href="who-said-it.html">
💬 PLAY GAME
</a>

</nav>

</header>


<section class="hero">

<div class="icon">
🏆
</div>

<div class="label">
AETHER ARCADE
</div>

<h1>
WHO SAID IT?
</h1>

<div class="subtitle">
Who knows the seven voices of AETHER?
</div>

</section>


<section class="card">

<div class="tabs">

<button
class="tab active"
id="allBtn">
ALL TIME
</button>

<button
class="tab"
id="todayBtn">
TODAY
</button>

</div>


<div id="tableWrap">
LOADING…
</div>

<div
class="me"
id="me">
</div>


<div class="actions">

<a
class="action"
href="who-said-it.html">
← BACK TO GAME
</a>

<a
class="action"
href="aether-arcade.html">
AETHER ARCADE
</a>

</div>

</section>


<footer>

ONE HALO · ONE VOICE · EVERY DAY<br>
AETHERVERSE

</footer>

</div>


<script>

const SUPABASE_URL=
"https://mkdkfnejqnqoalzyeqaw.supabase.co";

const SUPABASE_KEY=
"sb_publishable_uScqa4BUx4rq0lEmkVO-8Q_QsiyetmY";

const supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const tableWrap=
document.getElementById("tableWrap");

const me=
document.getElementById("me");

const allBtn=
document.getElementById("allBtn");

const todayBtn=
document.getElementById("todayBtn");


let mode="all_time";


function escapeHtml(value){

return String(value??"").replace(
/[&<>"']/g,
char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[char])
);

}


async function loadLeaderboard(){

tableWrap.innerHTML=
"LOADING…";

me.textContent="";


const {
data,
error
}=
await supabaseClient.rpc(
"get_who_said_it_leaderboard",
{
p_mode:mode
}
);


if(error){

console.error(error);

tableWrap.innerHTML=
"<div class='empty'>LEADERBOARD COULD NOT BE LOADED.</div>";

return;

}


const entries=
data?.entries||[];


if(!entries.length){

tableWrap.innerHTML=
"<div class='empty'>No scores yet.<br>Be the first HALO to play! ✦</div>";

return;

}


const my=data?.me;


let html=
"<table><thead><tr>"+
"<th>#</th>"+
"<th>HALO</th>"+
"<th>SCORE</th>"+
"</tr></thead><tbody>";


entries
.slice(0,50)
.forEach((entry,index)=>{

const isMe=
my &&
Number(entry.score)===
Number(my.score);

html+=
`<tr class="${isMe?"you":""}">
<td class="rank">
${entry.rank||index+1}
</td>

<td>
${escapeHtml(entry.halo_id||"HALO")}
</td>

<td class="score">
${Number(entry.score)||0}
</td>

</tr>`;

});


html+="</tbody></table>";


tableWrap.innerHTML=
html;


if(my){

me.textContent=
`YOUR BEST: ${Number(my.score)||0} POINTS`;

}

}


function setMode(next){

mode=next;

allBtn.classList.toggle(
"active",
mode==="all_time"
);

todayBtn.classList.toggle(
"active",
mode==="today"
);

loadLeaderboard();

}


allBtn.onclick=
()=>setMode("all_time");

todayBtn.onclick=
()=>setMode("today");


async function init(){

const {
data:{session}
}=
await supabaseClient.auth.getSession();


if(!session){

tableWrap.innerHTML=
"<div class='empty'>PLEASE LOG IN THROUGH MY HALO.</div>";

return;

}


loadLeaderboard();

}


init();

</script>

</body>
</html>
