<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My HALO | AETHERVERSE</title>
</head>
<body>
<script>
(async function () {
    const source =
        "https://raw.githubusercontent.com/AETHERVERSE/halo-universe/c37535418e3150198914121cde4d549c06bd9022/halo-home.html";

    try {
        const response = await fetch(source, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Could not load the original HALO page.");
        }

        let html = await response.text();

        /* Remove the newer duplicate HALO identity card. */
        html = html.replace(
            /<!-- =========================\s*MY HALO IDENTITY\s*========================= -->\s*<section\s+class="halo-identity-card"\s+id="haloIdentityCard">[\s\S]*?<\/section>\s*/i,
            ""
        );

        /* Remove the newer identity-card CSS. */
        html = html.replace(
            /\s*\/\* =========================\s*HALO IDENTITY\s*========================= \*\/\s*\.halo-identity-card \{[\s\S]*?\.halo-identity-points \{[\s\S]*?\}\s*/i,
            "\n"
        );

        /* Remove the identity-card class from the shared card selector. */
        html = html.replace(
            /,\s*\.halo-identity-card\s*\{/,
            " {"
        );

        /* Restore the original HALO ID display directly below the hero. */
        html = html.replace(
            /(<\/section>\s*<!-- =========================\s*MY HALO IDENTITY)/i,
            '$1'
        );

        const heroEnd = html.indexOf("</section>", html.indexOf('<section class="hero">'));
        if (heroEnd !== -1) {
            const insertAt = heroEnd + "</section>".length;
            html =
                html.slice(0, insertAt) +
                '\n\n<p class="email" id="haloEmail"></p>\n' +
                html.slice(insertAt);
        }

        /* Restore the original HALO ID styling. */
        html = html.replace(
            "</style>",
            '\n.email { color: #aaa0e6; font-style: italic; }\n\n</style>'
        );

        /* Replace the newer identity loader with the original behavior. */
        const start = html.indexOf(
            "/* =========================\n   HALO IDENTITY"
        );
        const rankStart = html.indexOf(
            "/* =========================\n   HALO RANK",
            start
        );

        if (start !== -1 && rankStart !== -1) {
            const loader =
`/* =========================
   HALO ID
========================= */

async function loadHaloIdentity(
    userId
) {

    const identityElement =
        document.getElementById(
            "haloEmail"
        );

    try {

        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
                .from("halo_profiles")
                .select("halo_id")
                .eq(
                    "user_id",
                    userId
                )
                .maybeSingle();

        if (profileError) {
            console.error(
                "PROFILE ERROR:",
                profileError
            );
        }

        const {
            data: admin,
            error: adminError
        } =
            await supabaseClient.rpc(
                "is_aether_admin"
            );

        if (adminError) {
            console.error(
                "AETHER ADMIN CHECK ERROR:",
                adminError
            );
        }

        if (admin === true) {

            identityElement.textContent =
                "AETHER ADMIN • NO HALO ID ASSIGNED";

        } else if (profile) {

            identityElement.textContent =
                "HALO ID: " +
                profile.halo_id;

        } else {

            identityElement.textContent =
                "NO HALO ID ASSIGNED";

        }

    } catch (error) {

        console.error(
            "PROFILE ERROR:",
            error
        );

        identityElement.textContent =
            "NO HALO ID ASSIGNED";

    }

}


`;
            html =
                html.slice(0, start) +
                loader +
                html.slice(rankStart);
        }

        /* Remove the obsolete top-points synchronization. */
        html = html.replace(
            /\s*\/\*\s*\* Also display the current points[\s\S]*?if \(identityPoints\) \{[\s\S]*?\}\s*/i,
            "\n"
        );

        /* Remove the obsolete error reference. */
        html = html.replace(
            /\s*document\s*\.getElementById\(\s*"haloIdentityPoints"\s*\)\s*\.textContent\s*=\s*"—";/i,
            ""
        );

        /* Write the corrected original page back into the document. */
        document.open();
        document.write(html);
        document.close();

    } catch (error) {
        document.body.innerHTML =
            "<p style='font-family:Georgia,serif;padding:30px;color:#f5efff;background:#0b0615'>" +
            "HALO could not be loaded. Please refresh the page." +
            "</p>";
        console.error(error);
    }
})();
</script>
</body>
</html>
