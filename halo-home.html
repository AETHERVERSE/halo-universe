
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My HALO | AETHERVERSE</title>
</head>
<body>
<script>
(async function () {
    const source = "https://raw.githubusercontent.com/AETHERVERSE/halo-universe/59a88608d3f210007d2e789424661a71ab61a696/halo-home.html";

    try {
        const response = await fetch(source, { cache: "no-store" });
        if (!response.ok) throw new Error("Could not load the HALO page source.");
        let html = await response.text();

        /*
         * =========================
         * FIX EXPLORE NAVIGATION
         * =========================
         */

        html = html.replace(
            /<a\s+href=["']index\.html["']>(\s*)EXPLORE(\s*)<\/a>/i,
            '<a href="explore.html">$1EXPLORE$2</a>'
        );

        /*
         * =========================
         * REMOVE OLD IDENTITY CARD
         * =========================
         */

        html = html.replace(
            /<!-- =========================\s*MY HALO IDENTITY\s*========================= -->\s*<section\s*class="halo-identity-card"\s*id="haloIdentityCard">[\s\S]*?<\/section>\s*/i,
            ""
        );

        html = html.replace(
            /\/\* =========================\s*HALO IDENTITY\s*========================= \*\/\s*\.halo-identity-card\s*\{[\s\S]*?\.halo-identity-points\s*\{[\s\S]*?\}\s*/i,
            ""
        );

        html = html.replace(
            /,\s*\.halo-identity-card\s*\{/,
            " {"
        );

        /*
         * =========================
         * INSERT HALO EMAIL / ID
         * =========================
         */

        const heroStart = html.indexOf('<section class="hero">');
        const heroEnd = html.indexOf("</section>", heroStart);

        if (heroStart === -1 || heroEnd === -1) {
            throw new Error("HALO hero section not found.");
        }

        const insertAt =
            heroEnd +
            "</section>".length;

        html =
            html.slice(0, insertAt) +
            '\n\n<p class="email" id="haloEmail"></p>\n' +
            html.slice(insertAt);

        html = html.replace("</style>", `
.email {
    color: #aaa0e6;
    font-style: italic;
}

/* =========================
   CHRISTMAS VAULT
========================= */

.christmas-vault-card {
    position: relative;
    display: block;
    overflow: hidden;
    text-decoration: none;
    color: #f5edcf;
    text-align: center;

    padding: 38px 25px;
    margin: 35px 0 45px;

    border: 1px solid rgba(211, 181, 111, 0.55);
    border-radius: 22px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(190, 155, 85, 0.20),
            transparent 65%
        ),
        linear-gradient(
            145deg,
            #142642,
            #091629 75%,
            #101c31
        );

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.28),
        inset 0 0 35px rgba(190, 155, 85, 0.04);

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.christmas-vault-card:hover {
    transform: translateY(-4px);

    border-color: rgba(235, 210, 145, 0.9);

    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.35),
        0 0 25px rgba(190, 155, 85, 0.12);
}

.christmas-vault-label {
    color: #d7bd7e;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

.christmas-vault-symbol {
    font-size: 43px;
    margin: 8px 0 15px;

    color: #e7ce91;

    text-shadow:
        0 0 18px rgba(225, 195, 120, 0.45);
}

.christmas-vault-card h2 {
    margin: 8px 0 12px;

    font-size: clamp(23px, 5vw, 34px);
    letter-spacing: 3px;
    font-weight: normal;
    color: #f3e6bd;
}

.christmas-vault-subtitle {
    color: #c9c4d5;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 17px;
}

.christmas-vault-description {
    max-width: 650px;
    margin: 0 auto;

    color: #d5d9e4;
    line-height: 1.8;
    font-size: 15px;
}

.christmas-vault-button {
    display: inline-block;
    margin-top: 25px;

    padding: 12px 26px;

    border: 1px solid rgba(220, 195, 130, 0.65);
    border-radius: 999px;

    color: #f2dfaa;
    background: rgba(190, 155, 85, 0.10);

    font-size: 12px;
    letter-spacing: 2px;
}

</style>`, 1);

        /*
         * =========================
         * CHRISTMAS VAULT CARD
         * =========================
         *
         * Inserted directly into
         * the My HALO dashboard.
         */

        const christmasVaultCard = `
<!-- =========================
     CHRISTMAS VAULT
========================= -->

<a
    class="christmas-vault-card"
    href="christmas-vault.html">

    <div class="christmas-vault-label">
        ✦ AETHER CHRISTMAS PRESENTS ✦
    </div>

    <div class="christmas-vault-symbol">
        ✧
    </div>

    <h2>
        CHRISTMAS VAULT
    </h2>

    <div class="christmas-vault-subtitle">
        THE 24TH STAR · DECEMBER 2026
    </div>

    <p class="christmas-vault-description">
        24 Days. 7 Stars. 1 Universe.
        <br>
        A special Christmas journey is waiting for you.
        Follow the seven stars and discover the light
        that brings AETHER and HALO together.
    </p>

    <div class="christmas-vault-button">
        OPEN THE CHRISTMAS VAULT →
    </div>

</a>
`;

        if (html.includes('class="christmas-vault-card"')) {
            throw new Error("Christmas Vault card already exists in the source.");
        }

        if (!html.includes('<section class="daily">')) {
            throw new Error("HALO DAILY section not found.");
        }

        html = html.replace(
            '<section class="daily">',
            christmasVaultCard + '\n<section class="daily">'
        );

        /*
         * =========================
         * REPLACE HALO ID LOADER
         * =========================
         */

        const identityStart =
            html.indexOf(
                "/* =========================\n   HALO IDENTITY"
            );

        const rankStart =
            html.indexOf(
                "/* =========================\n   HALO RANK",
                identityStart
            );

        if (
            identityStart === -1 ||
            rankStart === -1
        ) {
            throw new Error(
                "HALO ID loader section not found."
            );
        }

        const originalHaloIdLoader = `
/* =========================
   HALO ID
========================= */

async function loadHaloIdentity(userId) {
    const identityElement =
        document.getElementById("haloEmail");

    try {
        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("halo_profiles")
            .select("halo_id")
            .eq("user_id", userId)
            .maybeSingle();

        if (profileError) {
            console.error(
                "PROFILE ERROR:",
                profileError
            );
        }

        const {
            data: admin,
            error: adminError
        } = await supabaseClient.rpc(
            "is_aether_admin"
        );

        if (adminError) {
            console.error(
                "AETHER ADMIN CHECK ERROR:",
                adminError
            );
        }

        if (admin === true) {

            identityElement.textContent =
                "AETHER ADMIN • NO HALO ID ASSIGNED";

        } else if (profile) {

            identityElement.textContent =
                "HALO ID: " +
                profile.halo_id;

        } else {

            identityElement.textContent =
                "NO HALO ID ASSIGNED";

        }

    } catch (error) {

        console.error(
            "PROFILE ERROR:",
            error
        );

        identityElement.textContent =
            "NO HALO ID ASSIGNED";
    }
}


`;

        html =
            html.slice(
                0,
                identityStart
            ) +
            originalHaloIdLoader +
            html.slice(rankStart);

        /*
         * =========================
         * REMOVE OLD POINTS CODE
         * =========================
         */

        html = html.replace(
            /\/\*\s*\* Also display the current points[\s\S]*?if\s*\(identityPoints\)\s*\{[\s\S]*?\}\s*/i,
            "\n"
        );

        html = html.replace(
            /document\s*\.getElementById\(\s*"haloIdentityPoints"\s*\)\s*\.textContent\s*=\s*"—"\s*;/i,
            ""
        );

        /*
         * =========================
         * TEMPORARY EMAIL TEST
         * =========================
         */

        const emailTestHtml = `
<style>
#haloEmailTest {
    display: none;
    margin: 18px auto 30px;
    max-width: 520px;
    padding: 16px;
    border: 1px solid rgba(170,160,230,.35);
    border-radius: 16px;
    background: rgba(20,12,35,.72);
    text-align: center;
}

#haloEmailTest button {
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 15px;
    cursor: pointer;
    background: #aaa0e6;
    color: #171020;
}

#haloEmailTestStatus {
    margin-top: 10px;
    font-size: 13px;
    color: #aaa0e6;
}
</style>

<section id="haloEmailTest">

    <button
        type="button"
        id="sendHaloTestEmail"
    >
        📧 Test E-Mail an HALO senden
    </button>

    <div id="haloEmailTestStatus"></div>

</section>`;

        html = html.replace(
            "</body>",
            emailTestHtml +
            "\n</body>"
        );

        const emailTestScript = `
/* =========================
   TEMPORARY BREVO TEST
========================= */

async function setupHaloEmailTest() {

    const box =
        document.getElementById(
            "haloEmailTest"
        );

    const button =
        document.getElementById(
            "sendHaloTestEmail"
        );

    const status =
        document.getElementById(
            "haloEmailTestStatus"
        );

    if (
        !box ||
        !button ||
        !status
    ) {
        return;
    }

    try {

        const {
            data: admin,
            error: adminError
        } =
            await supabaseClient.rpc(
                "is_aether_admin"
            );

        if (adminError) {

            console.error(
                "BREVO TEST ADMIN CHECK ERROR:",
                adminError
            );

            return;
        }

        if (admin !== true) {
            return;
        }

        box.style.display =
            "block";

        button.addEventListener(
            "click",
            async () => {

                button.disabled =
                    true;

                status.textContent =
                    "Sende Testmail … ✨";

                try {

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.functions.invoke(
                            "send-email",
                            {
                                body: {
                                    to: "carinawiedemann2@gmail.com",

                                    subject:
                                        "AETHER • HALO – Testmail",

                                    htmlContent:
                                        "<h2>AETHER • HALO</h2>" +
                                        "<p>Das ist eine Testmail aus dem AETHERVERSE.</p>" +
                                        "<p>Wenn du diese Nachricht erhältst, funktioniert die Verbindung von AETHER → Supabase → Brevo. 💜</p>"
                                }
                            }
                        );

                    if (error) {
                        throw error;
                    }

                    console.log(
                        "BREVO TEST RESPONSE:",
                        data
                    );

                    status.textContent =
                        "✅ Testmail wurde gesendet.";

                } catch (error) {

                    console.error(
                        "BREVO TEST ERROR:",
                        error
                    );

                    status.textContent =
                        "❌ Fehler: " +
                        (
                            error &&
                            error.message
                                ? error.message
                                : String(error)
                        );

                } finally {

                    button.disabled =
                        false;

                }
            }
        );

    } catch (error) {

        console.error(
            "BREVO TEST SETUP ERROR:",
            error
        );

    }
}

setupHaloEmailTest();
`;

        html = html.replace(
            "loadHalo();",
            emailTestScript +
            "\nloadHalo();"
        );

        /*
         * =========================
         * RENDER FINAL PAGE
         * =========================
         */

        document.open();
        document.write(html);
        document.close();

    } catch (error) {

        console.error(
            "HALO loading error:",
            error
        );

        document.body.innerHTML =
            "<p style='font-family:Georgia,serif;padding:30px;color:#f5efff;background:#0b0615'>" +
            "HALO could not be loaded. Please refresh the page." +
            "</p>";
    }

})();
</script>
</body>
</html>
