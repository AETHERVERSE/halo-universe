<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AETHER — Your Star</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #30245f 0%, #17112f 55%, #0b0818 100%);
    color: #eeeaff;
    font-family: Georgia, "Times New Roman", serif;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 80px;
}

.top-symbol {
    text-align: center;
    font-size: 48px;
    margin-bottom: 10px;
}

h1 {
    text-align: center;
    font-size: 42px;
    letter-spacing: 4px;
    margin: 0;
}

.subtitle {
    text-align: center;
    font-size: 22px;
    color: #c9bdf2;
    margin: 15px 0 35px;
}

.status {
    text-align: center;
    padding: 25px;
    margin-bottom: 30px;
    border: 1px solid #594c86;
    border-radius: 24px;
    background: rgba(255,255,255,0.04);
    font-size: 20px;
}

.current {
    text-align: center;
    padding: 30px 20px;
    margin-bottom: 35px;
    border-radius: 28px;
    border: 1px solid #a98cff;
    background: rgba(117, 88, 180, 0.15);
}

.current-title {
    color: #cfc1ff;
    font-size: 18px;
    margin-bottom: 12px;
}

.current-star {
    font-size: 30px;
    letter-spacing: 3px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.star-card {
    padding: 30px 20px;
    text-align: center;
    border-radius: 24px;
    border: 1px solid #554879;
    background: rgba(255,255,255,0.045);
    cursor: pointer;
    transition: 0.25s ease;
}

.star-card:hover {
    transform: translateY(-4px);
    border-color: #b79cff;
    background: rgba(133, 101, 210, 0.16);
}

.star-symbol {
    font-size: 50px;
    margin-bottom: 15px;
}

.star-name {
    font-size: 25px;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.star-story {
    color: #c5b8e9;
    font-size: 17px;
}

.message {
    text-align: center;
    margin-top: 30px;
    min-height: 30px;
    font-size: 18px;
}

footer {
    text-align: center;
    margin-top: 60px;
    color: #8e82b4;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

    <div class="top-symbol">✦</div>

    <h1>YOUR STAR</h1>

    <div class="subtitle">
        Choose the star that calls to you.
    </div>

    <div class="status" id="status">
        Connecting to AETHER...
    </div>

    <div class="current" id="currentBox" style="display:none;">
        <div class="current-title">
            YOUR CURRENT STAR
        </div>

        <div class="current-star" id="currentStar">
        </div>
    </div>

    <div class="grid">

        <div class="star-card" onclick="chooseStar('Solen')">
            <div class="star-symbol">☀️</div>
            <div class="star-name">SOLEN</div>
            <div class="star-story">The First Light</div>
        </div>

        <div class="star-card" onclick="chooseStar('Vex')">
            <div class="star-symbol">🌑</div>
            <div class="star-name">VEX</div>
            <div class="star-story">The Shadow</div>
        </div>

        <div class="star-card" onclick="chooseStar('Kairo')">
            <div class="star-symbol">⚡</div>
            <div class="star-name">KAIRO</div>
            <div class="star-story">The Storm</div>
        </div>

        <div class="star-card" onclick="chooseStar('Riven')">
            <div class="star-symbol">🌊</div>
            <div class="star-name">RIVEN</div>
            <div class="star-story">The Tide</div>
        </div>

        <div class="star-card" onclick="chooseStar('Zenith')">
            <div class="star-symbol">🔥</div>
            <div class="star-name">ZENITH</div>
            <div class="star-story">The Flame</div>
        </div>

        <div class="star-card" onclick="chooseStar('Lux')">
            <div class="star-symbol">✨</div>
            <div class="star-name">LUX</div>
            <div class="star-story">The Light</div>
        </div>

        <div class="star-card" onclick="chooseStar('Nero')">
            <div class="star-symbol">🌙</div>
            <div class="star-name">NERO</div>
            <div class="star-story">The Night</div>
        </div>

    </div>

    <div class="message" id="message"></div>

    <footer>
        #WEAREHALO • #WEAREAETHER
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://mkdkfnejqnqoalzyeqaw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uScqa4BUx4rq01EmkVO-8Q_Qsiy...";

/*
   IMPORTANT:
   Keep the complete publishable key from your other AETHER files here.
*/

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;


/* =========================
   START
========================= */

async function startPage() {

    const status =
        document.getElementById("status");

    try {

        const {
            data: { session },
            error
        } =
        await supabaseClient.auth.getSession();

        if (error) {
            status.textContent =
                "Could not connect to AETHER.";
            console.error(error);
            return;
        }

        if (!session || !session.user) {

            status.textContent =
                "Please LOG IN first.";

            return;
        }

        currentUser = session.user;

        status.textContent =
            "Connected to AETHER ✦";

        await loadCurrentStar();

    } catch (err) {

        console.error(err);

        status.textContent =
            "Could not connect to AETHER.";

    }
}


/* =========================
   CURRENT STAR
========================= */

async function loadCurrentStar() {

    const currentBox =
        document.getElementById("currentBox");

    const currentStar =
        document.getElementById("currentStar");

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("halo_stars")
            .select("star_name")
            .eq("user_id", currentUser.id)
            .maybeSingle();

        /*
          maybeSingle() is important.
          No star yet = normal, not an error.
        */

        if (error) {

            console.error(
                "STAR CHECK ERROR:",
                error
            );

            document.getElementById("status")
                .textContent =
                "Could not check your current star.";

            return;
        }

        if (!data) {

            currentBox.style.display = "block";

            currentStar.textContent =
                "No star chosen yet ✦";

            return;
        }

        currentBox.style.display = "block";

        currentStar.textContent =
            data.star_name;

    } catch (err) {

        console.error(err);

        document.getElementById("status")
            .textContent =
            "Could not check your current star.";

    }
}


/* =========================
   CHOOSE STAR
========================= */

async function chooseStar(starName) {

    const message =
        document.getElementById("message");

    if (!currentUser) {

        message.textContent =
            "Please LOG IN first.";

        return;
    }

    message.textContent =
        "Connecting to " + starName + "...";

    try {

        /*
          First check whether the user
          already has a star.
        */

        const {
            data: existingStar,
            error: checkError
        } =
        await supabaseClient
            .from("halo_stars")
            .select("star_name")
            .eq("user_id", currentUser.id)
            .maybeSingle();

        if (checkError) {

            console.error(
                "CHECK ERROR:",
                checkError
            );

            message.textContent =
                "Could not check your current star.";

            return;
        }


        /*
          If a star already exists,
          update it.
        */

        if (existingStar) {

            const {
                error: updateError
            } =
            await supabaseClient
                .from("halo_stars")
                .update({
                    star_name: starName
                })
                .eq("user_id", currentUser.id);

            if (updateError) {

                console.error(
                    "UPDATE ERROR:",
                    updateError
                );

                message.textContent =
                    "Could not save your star.";

                return;
            }

        }

        /*
          If no star exists yet,
          create one.
        */

        else {

            const {
                error: insertError
            } =
            await supabaseClient
                .from("halo_stars")
                .insert({
                    user_id: currentUser.id,
                    star_name: starName
                });

            if (insertError) {

                console.error(
                    "INSERT ERROR:",
                    insertError
                );

                message.textContent =
                    "Could not save your star.";

                return;
            }
        }


        /*
          Update the page immediately.
        */

        document.getElementById("currentBox")
            .style.display = "block";

        document.getElementById("currentStar")
            .textContent = starName;

        message.textContent =
            "Your connection to " +
            starName +
            " has been chosen ✦";

    } catch (err) {

        console.error(err);

        message.textContent =
            "Something went wrong.";

    }
}


/* =========================
   RUN
========================= */

startPage();

</script>

</body>
</html>
