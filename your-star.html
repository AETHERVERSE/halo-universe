<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AETHER — Your Star</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #30245f 0%, #14112f 45%, #0d0b22 100%);
    color: #eeeaff;
    font-family: Georgia, "Times New Roman", serif;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 80px;
}

.top-symbol {
    text-align: center;
    font-size: 48px;
    margin-bottom: 10px;
}

h1 {
    text-align: center;
    font-size: 42px;
    letter-spacing: 4px;
    margin: 0;
}

.subtitle {
    text-align: center;
    font-size: 20px;
    color: #bdb0e9;
    margin: 15px 0 35px;
}

.halo-card {
    background: rgba(38, 32, 72, 0.88);
    border: 1px solid rgba(190, 170, 255, 0.25);
    border-radius: 24px;
    padding: 30px;
    margin-bottom: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.halo-id {
    text-align: center;
    color: #cfc3ff;
    font-style: italic;
    font-size: 18px;
}

.current-star {
    text-align: center;
    font-size: 22px;
    margin-top: 20px;
}

.current-star strong {
    color: #f2dcff;
}

.message {
    text-align: center;
    margin: 20px 0;
    font-size: 18px;
    color: #d9cff8;
}

.stars {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
}

.star-button {
    width: 100%;
    border: 1px solid rgba(200,180,255,0.28);
    border-radius: 20px;
    background: rgba(30,25,60,0.9);
    color: #eeeaff;
    padding: 25px 18px;
    cursor: pointer;
    font-family: Georgia, "Times New Roman", serif;
    transition: 0.25s ease;
}

.star-button:hover {
    transform: translateY(-4px);
    background: rgba(58,45,100,0.95);
    border-color: #bfa7ff;
    box-shadow: 0 10px 30px rgba(150,120,255,0.2);
}

.star-symbol {
    font-size: 38px;
    margin-bottom: 10px;
}

.star-name {
    font-size: 25px;
    letter-spacing: 2px;
}

.star-description {
    margin-top: 8px;
    color: #bdb0e9;
    font-size: 15px;
}

.selected {
    border-color: #e4c9ff;
    box-shadow: 0 0 25px rgba(210,180,255,0.3);
}

.back {
    display: block;
    width: fit-content;
    margin: 35px auto 0;
    padding: 12px 24px;
    border-radius: 30px;
    border: 1px solid rgba(200,180,255,0.3);
    color: #eeeaff;
    text-decoration: none;
    background: rgba(35,30,70,0.8);
}

.back:hover {
    background: rgba(65,50,110,0.9);
}

footer {
    text-align: center;
    margin-top: 60px;
    color: #9186bd;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">

    <div class="top-symbol">✦</div>

    <h1>YOUR STAR</h1>

    <div class="subtitle">
        Choose the star that calls to you.
    </div>

    <div class="halo-card">

        <div class="halo-id" id="haloId">
            Connecting to AETHER...
        </div>

        <div class="current-star" id="currentStar">
            Your connection is waiting to be discovered.
        </div>

    </div>

    <div class="halo-card">

        <div class="message" id="message">
            Choose one of the seven stars of AETHER.
        </div>

        <div class="stars">

            <button class="star-button" onclick="chooseStar('Solen')" id="star-Solen">
                <div class="star-symbol">☀️</div>
                <div class="star-name">SOLEN</div>
                <div class="star-description">
                    The First Light
                </div>
            </button>

            <button class="star-button" onclick="chooseStar('Vex')" id="star-Vex">
                <div class="star-symbol">🌑</div>
                <div class="star-name">VEX</div>
                <div class="star-description">
                    The Shadow
                </div>
            </button>

            <button class="star-button" onclick="chooseStar('Kairo')" id="star-Kairo">
                <div class="star-symbol">⚡</div>
                <div class="star-name">KAIRO</div>
                <div class="star-description">
                    The Energy
                </div>
            </button>

            <button class="star-button" onclick="chooseStar('Riven')" id="star-Riven">
                <div class="star-symbol">🌊</div>
                <div class="star-name">RIVEN</div>
                <div class="star-description">
                    The Heart
                </div>
            </button>

            <button class="star-button" onclick="chooseStar('Zenith')" id="star-Zenith">
                <div class="star-symbol">🔥</div>
                <div class="star-name">ZENITH</div>
                <div class="star-description">
                    The Spark
                </div>
            </button>

            <button class="star-button" onclick="chooseStar('Lux')" id="star-Lux">
                <div class="star-symbol">✨</div>
                <div class="star-name">LUX</div>
                <div class="star-description">
                    The Comfort
                </div>
            </button>

            <button class="star-button" onclick="chooseStar('Nero')" id="star-Nero">
                <div class="star-symbol">🌙</div>
                <div class="star-name">NERO</div>
                <div class="star-description">
                    The Night
                </div>
            </button>

        </div>

    </div>

    <a href="halo-home.html" class="back">
        ← Back to My Halo
    </a>

    <footer>
        #WEAREHALO • #WEAREAETHER
    </footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://mkdkfnejqnqoalzyeqaw.supabase.co";

const SUPABASE_KEY = "sb_publishable_uScqa4BUx4rq0lEmkVO-8Q_QsiyetmY".replace(" ", "");

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let currentHaloId = null;


/* =========================
   INITIALIZE PAGE
========================= */

async function initializePage() {

    const message = document.getElementById("message");

    try {

        /*
         * Get the existing logged-in session.
         * We deliberately use getSession() here because
         * this page must continue the session from HALO HOME.
         */

        const {
            data: { session },
            error: sessionError
        } = await supabaseClient.auth.getSession();


        if (sessionError) {

            console.error(sessionError);

            message.textContent =
                "Unable to read your AETHER session.";

            return;
        }


        if (!session || !session.user) {

            message.textContent =
                "PLEASE LOG IN FIRST.";

            document.getElementById("haloId").textContent =
                "No active HALO session found.";

            return;
        }


        currentUser = session.user;


        /*
         * Get HALO profile
         */

        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("halo_profiles")
            .select("halo_id")
            .eq("user_id", currentUser.id)
            .single();


        if (profileError) {

            console.error(profileError);

            message.textContent =
                "Your HALO profile could not be found.";

            return;
        }


        currentHaloId = profile.halo_id;


        document.getElementById("haloId").textContent =
            "HALO ID: " + currentHaloId;


        message.textContent =
            "Choose your star among the seven.";


        /*
         * Check whether the HALO already has a star.
         */

        const {
            data: star,
            error: starError
        } = await supabaseClient
            .from("halo_stars")
            .select("star_name")
            .eq("user_id", currentUser.id)
            .maybeSingle();


        if (!starError && star) {

            showCurrentStar(star.star_name);

        }

    } catch (error) {

        console.error(error);

        message.textContent =
            "Something went wrong connecting to AETHER.";

    }

}


/* =========================
   SHOW CURRENT STAR
========================= */

function showCurrentStar(starName) {

    document.getElementById("currentStar").innerHTML =
        "Your star is <strong>" + starName + "</strong> ⭐";


    document.querySelectorAll(".star-button").forEach(button => {
        button.classList.remove("selected");
    });


    const selectedButton =
        document.getElementById("star-" + starName);

    if (selectedButton) {
        selectedButton.classList.add("selected");
    }

}


/* =========================
   CHOOSE STAR
========================= */

async function chooseStar(starName) {

    const message = document.getElementById("message");


    /*
     * Make absolutely sure we have the current session.
     */

    const {
        data: { session },
        error: sessionError
    } = await supabaseClient.auth.getSession();


    if (
        sessionError ||
        !session ||
        !session.user
    ) {

        message.textContent =
            "PLEASE LOG IN FIRST.";

        return;
    }


    currentUser = session.user;


    message.textContent =
        "Connecting your HALO to " + starName + "...";


    /*
     * Check whether this HALO already has a selected star.
     */

    const {
        data: existingStar,
        error: existingError
    } = await supabaseClient
        .from("halo_stars")
        .select("star_name")
        .eq("user_id", currentUser.id)
        .maybeSingle();


    if (existingError) {

        console.error(existingError);

        message.textContent =
            "Could not check your current star.";

        return;
    }


    /*
     * If a star already exists, update it.
     * Otherwise create a new one.
     */

    let result;


    if (existingStar) {

        result = await supabaseClient
            .from("halo_stars")
            .update({
                star_name: starName
            })
            .eq("user_id", currentUser.id);

    } else {

        result = await supabaseClient
            .from("halo_stars")
            .insert({
                user_id: currentUser.id,
                star_name: starName
            });

    }


    if (result.error) {

        console.error(result.error);

        message.textContent =
            "Your star could not be saved.";

        return;
    }


    /*
     * Success!
     */

    showCurrentStar(starName);

    message.textContent =
        "Your connection has been chosen. ✦";


}


/* =========================
   START
========================= */

initializePage();

</script>

</body>
    </html>
