<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHER MEMORY | HALO LEADERBOARD</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#30275f 0%,#171433 38%,#0b0920 100%);color:#eeeaff;font-family:Georgia,serif}
.container{width:min(900px,94%);margin:auto;padding:24px 0 55px}
header{text-align:center;margin-bottom:35px}
.logo{color:#aaa0e6;font-size:.8rem;letter-spacing:6px;margin-bottom:20px}
.back{display:inline-block;color:#cdb9ff;text-decoration:none;border:1px solid #514879;border-radius:25px;padding:9px 18px;font-size:.75rem;letter-spacing:1.5px}
.hero{text-align:center;padding:20px 0 28px}.icon{font-size:3.5rem}
.kicker{color:#aaa0e6;letter-spacing:5px;font-size:.75rem;margin-top:12px}
h1{font-size:clamp(2rem,7vw,3.2rem);letter-spacing:4px;margin:10px 0}
.sub{color:#aaa0e6;line-height:1.7}
.panel{background:rgba(18,16,36,.92);border:1px solid #39345e;border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.tab{border:1px solid #514879;background:transparent;color:#cdb9ff;border-radius:20px;padding:9px 16px;cursor:pointer;letter-spacing:1.5px;font-size:.7rem}
.tab.active{background:#29264b;border-color:#b6a9f1;color:#eeeaff}
.status{text-align:center;color:#aaa0e6;font-size:.75rem;min-height:20px;margin-bottom:12px}
.table{width:100%;border-collapse:collapse}
th{text-align:left;color:#77739e;font-size:.65rem;letter-spacing:2px;padding:12px 10px;border-bottom:1px solid #39345e}
td{padding:14px 10px;border-bottom:1px solid rgba(57,52,94,.55);font-size:.9rem}
tr.me{background:rgba(120,104,189,.12)}
.rank{color:#f4d27a;font-weight:800;width:55px}.halo{font-weight:800}.score{font-weight:800;text-align:right}
.small{text-align:right;color:#aaa0e6;font-size:.75rem}
.refresh{display:block;margin:20px auto 4px;border:1px solid #8f84c9;background:#29264b;color:#eeeaff;border-radius:22px;padding:10px 18px;cursor:pointer}
footer{text-align:center;margin-top:35px;color:#625d86;font-size:.7rem;letter-spacing:2px}
@media(max-width:600px){
 .panel{padding:10px}.table th:nth-child(4),.table td:nth-child(4){display:none}
 td{padding:12px 7px}.small{font-size:.68rem}
}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">AETHERVERSE</div>
<a class="back" href="aether-arcade.html">← BACK TO AETHER ARCADE</a>
</header>

<section class="hero">
<div class="icon">🧠</div>
<div class="kicker">HALO • AETHER ARCADE</div>
<h1>MEMORY LEADERBOARD</h1>
<div class="sub">Remember the stars. Beat the board. ✨</div>
</section>

<main class="panel">
<div class="tabs">
<button class="tab active" data-mode="all_time">ALL TIME</button>
<button class="tab" data-mode="today">TODAY</button>
</div>
<div class="status" id="status">Loading leaderboard…</div>
<table class="table">
<thead><tr><th>RANK</th><th>HALO</th><th>SCORE</th><th>COMBO</th><th>PERFECT</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<button class="refresh" id="refresh">↻ REFRESH</button>
</main>

<footer>ONE LIGHT • SEVEN STARS • ENDLESS LOVE<br><br>#WEAREHALO • #WEAREAETHER</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://mkdkfnejqnqoalzyeqaw.supabase.co";
const SUPABASE_KEY="sb_publishable_uScqa4BUx4rq0lEmkVO-8Q_QsiyetmY";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let mode="all_time";

function escapeHtml(value){
 return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
async function loadLeaderboard(){
 const status=document.getElementById("status"),rows=document.getElementById("rows");
 status.textContent="Loading leaderboard…";
 rows.innerHTML="";
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session){window.location.replace("halo.html");return}
 const {data,error}=await supabaseClient.rpc("get_aether_memory_leaderboard",{p_mode:mode});
 if(error){
   console.error(error);
   status.textContent="Leaderboard could not be loaded.";
   return;
 }
 const entries=Array.isArray(data?.entries)?data.entries:[];
 const me=data?.me;
 status.textContent=entries.length?`${entries.length} HALO on the board`:"No scores yet — be the first! ✨";
 rows.innerHTML=entries.map(e=>`
 <tr class="${me&&Number(e.score)===Number(me.score)&&Number(e.best_combo)===Number(me.best_combo)?"me":""}">
  <td class="rank">#${escapeHtml(e.rank)}</td>
  <td class="halo">${escapeHtml(e.halo_id||"HALO")}</td>
  <td class="score">${escapeHtml(e.score)}</td>
  <td class="small">${escapeHtml(e.best_combo)}</td>
  <td class="small">${escapeHtml(e.perfect_count)}</td>
 </tr>`).join("");
}
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 tab.classList.add("active");mode=tab.dataset.mode;loadLeaderboard();
}));
document.getElementById("refresh").addEventListener("click",loadLeaderboard);
loadLeaderboard();
</script>
</body>
</html>
